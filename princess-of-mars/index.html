      glossSpeakJapanese.setAttribute("aria-pressed", String(japaneseSpeaking));
      glossSpeakJapanese.setAttribute(
        "aria-label",
        japaneseSpeaking
          ? "Parar leitura em japonês dos glosses de escuta da frase atual"
          : "Ouvir somente em japonês os glosses de escuta da frase atual"
      );
      glossSpeakJapanese.textContent = japaneseSpeaking ? "■ JP" : "▶ JP";
      glossSpeakJapanese.title = browserSpeechAvailable
        ? "Ouvir uma vez, somente em japonês, os glosses marcados para escuta nesta frase"
        : "Síntese de voz indisponível neste navegador";
    }

    function updateTranslationSpeechButton(speaking = false) {
      translationSpeak.disabled = !browserSpeechAvailable;
      translationSpeak.setAttribute("aria-pressed", String(speaking));
      translationSpeak.setAttribute(
        "aria-label",
        speaking ? "Parar leitura da tradução em português" : "Ouvir tradução em português"
      );
      translationSpeak.textContent = speaking ? "■ PT" : "▶ PT";
      translationSpeak.title = browserSpeechAvailable
        ? "Ouvir a tradução da frase em português"
        : "Síntese de voz indisponível neste navegador";
    }

    function stopBrowserSpeech() {
      if (browserSpeechAvailable) window.speechSynthesis.cancel();
      markedGlossSpeechRun += 1;
      markedGlossSpeechActive = false;
      markedGlossSpeechMode = null;
      markedGlossSpeechQueue = [];
      markedGlossSpeechOnComplete = null;
      sentenceAudioLoopSpeechActive = false;
      translationSpeechRun += 1;
      translationSpeechActive = false;
      translationSpeechOnComplete = null;
      updateGlossSpeechButton(null);
      updateTranslationSpeechButton(false);
    }

    function speakNextMarkedGlossPart(run) {
      if (run !== markedGlossSpeechRun) return;
      const next = markedGlossSpeechQueue.shift();
      if (!next) {
        const onComplete = markedGlossSpeechOnComplete;
        markedGlossSpeechActive = false;
        markedGlossSpeechMode = null;
        markedGlossSpeechOnComplete = null;
        sentenceAudioLoopSpeechActive = false;
        updateGlossSpeechButton(null);
        if (run === markedGlossSpeechRun && onComplete) onComplete();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(next.text);
      utterance.lang = next.lang;
      utterance.rate = 0.9;
      const language = next.lang.toLowerCase();
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(
        (candidate) => candidate.lang.toLowerCase() === language
      ) || voices.find(
        (candidate) => candidate.lang.toLowerCase().startsWith(language.split("-")[0])
      );
      if (voice) utterance.voice = voice;
      const advance = () => {
        if (run === markedGlossSpeechRun) speakNextMarkedGlossPart(run);
      };
      utterance.addEventListener("end", advance);
      utterance.addEventListener("error", advance);
      try {
        window.speechSynthesis.speak(utterance);
      } catch (_error) {
        advance();
      }
    }

    function startMarkedGlossSpeech(
      glosses,
      { loopSequence = false, japaneseOnly = false, onComplete = null } = {}
    ) {
      stopBrowserSpeech();
      markedGlossSpeechRun += 1;
      const run = markedGlossSpeechRun;
      markedGlossSpeechQueue = japaneseOnly
        ? glosses.map(({ term }) => ({ text: term, lang: "ja-JP" }))
        : glosses.flatMap(({ term, portuguese }) => [
            { text: term, lang: "ja-JP" },
            { text: portuguese, lang: "pt-BR" },
            { text: term, lang: "ja-JP" }
          ]);
      markedGlossSpeechOnComplete = onComplete;
      sentenceAudioLoopSpeechActive = loopSequence;
      if (loopSequence) {
        sentenceAudioStatus.textContent = japaneseOnly ? "Lendo glosses JP…" : "Lendo glosses…";
      }
      markedGlossSpeechActive = true;
      markedGlossSpeechMode = japaneseOnly ? "ja" : "full";
      updateGlossSpeechButton(markedGlossSpeechMode);
      speakNextMarkedGlossPart(run);
    }

    function toggleMarkedGlossSpeech(japaneseOnly = false) {
      const glosses = currentSentenceListeningGlosses();
      if (!browserSpeechAvailable || glosses.length === 0) return;
      const requestedMode = japaneseOnly ? "ja" : "full";
      if (markedGlossSpeechActive && markedGlossSpeechMode === requestedMode) {
        stopBrowserSpeech();
        return;
      }
      stopSentenceAudio();
      startMarkedGlossSpeech(glosses, { japaneseOnly });
    }

    function scheduleSentenceAudioLoopPlayback(expectedMode = sentenceAudioLoopMode) {
      sentenceAudioStatus.textContent = "Frase em 0,5 s…";
      sentenceAudioLoopTimer = setTimeout(() => {
        sentenceAudioLoopTimer = null;
        if (sentenceAudioLoopMode !== expectedMode) return;
        playSentenceAudio({ restart: true });
      }, sentenceAudioLoopDelayMs);
    }

    function startGlossesThenSentence() {
      const expectedMode = sentenceAudioLoopMode;
      const glosses = currentSentenceListeningGlosses();
      if (!browserSpeechAvailable || glosses.length === 0) {
        playSentenceAudio({ restart: true });
        return;
      }
      startMarkedGlossSpeech(glosses, {
        loopSequence: true,
        japaneseOnly: loopModeUsesJapaneseOnlyGlosses(expectedMode),
        onComplete: () => {
          if (sentenceAudioLoopMode === expectedMode) scheduleSentenceAudioLoopPlayback(expectedMode);
        }
      });
    }

    function scheduleGlossesThenSentence() {
      const expectedMode = sentenceAudioLoopMode;
      sentenceAudioStatus.textContent = loopModeUsesJapaneseOnlyGlosses(expectedMode)
        ? "Glosses JP em 0,5 s…"
        : "Glosses em 0,5 s…";
      sentenceAudioLoopTimer = setTimeout(() => {
        sentenceAudioLoopTimer = null;
        if (sentenceAudioLoopMode !== expectedMode) return;
        startGlossesThenSentence();
      }, sentenceAudioLoopDelayMs);
    }

    function scheduleTranslationThenSentence() {
      const expectedMode = sentenceAudioLoopMode;
      sentenceAudioStatus.textContent = "Tradução em 0,5 s…";
      sentenceAudioLoopTimer = setTimeout(() => {
        sentenceAudioLoopTimer = null;
        if (sentenceAudioLoopMode !== expectedMode) return;
        startTranslationThenSentence();
      }, sentenceAudioLoopDelayMs);
    }

    function nextSentenceInCurrentParagraph() {
      const paragraph = sentenceParagraphIndexes[activeIndex];
      const start = paragraphSentenceStarts[paragraph];
      const end = start + paragraphSentenceCounts[paragraph];
      return activeIndex + 1 < end ? activeIndex + 1 : start;
    }

    function scheduleNextParagraphSentence() {
      const expectedMode = sentenceAudioLoopMode;
      sentenceAudioStatus.textContent = "Próxima frase em 0,5 s…";
      sentenceAudioLoopTimer = setTimeout(() => {
        sentenceAudioLoopTimer = null;
        if (sentenceAudioLoopMode !== expectedMode) return;
        renderCard(nextSentenceInCurrentParagraph());
        if (sentenceAudioLoopMode !== expectedMode) return;
        if (loopModeUsesGlosses(expectedMode)) startGlossesThenSentence();
        else if (loopModeUsesTranslation(expectedMode)) startTranslationThenSentence();
        else playSentenceAudio({ restart: true });
      }, sentenceAudioLoopDelayMs);
    }

    function continueSentenceAudioLoop() {
      if (sentenceAudioLoopMode === "off") return;
      if (loopModeUsesParagraph()) {
        scheduleNextParagraphSentence();
      } else if (loopModeUsesGlosses()) {
        scheduleGlossesThenSentence();
      } else if (loopModeUsesTranslation()) {
        scheduleTranslationThenSentence();
      } else {
        scheduleSentenceAudioLoopPlayback();
      }
    }

    function startTranslationSpeech({ loopSequence = false, onComplete = null } = {}) {
      stopBrowserSpeech();
      const run = translationSpeechRun;
      const utterance = new SpeechSynthesisUtterance(sentences[activeIndex].pt);
      utterance.lang = "pt-BR";
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(
        (candidate) => candidate.lang.toLowerCase() === "pt-br"
      ) || voices.find(
        (candidate) => candidate.lang.toLowerCase().startsWith("pt")
      );
      if (voice) utterance.voice = voice;
      translationSpeechOnComplete = onComplete;
      sentenceAudioLoopSpeechActive = loopSequence;
      if (loopSequence) sentenceAudioStatus.textContent = "Lendo tradução…";
      const finish = () => {
        if (run !== translationSpeechRun) return;
        const completed = translationSpeechOnComplete;
        translationSpeechActive = false;
        translationSpeechOnComplete = null;
        sentenceAudioLoopSpeechActive = false;
        updateTranslationSpeechButton(false);
        if (completed) completed();
      };
      utterance.addEventListener("end", finish);
      utterance.addEventListener("error", finish);
      translationSpeechActive = true;
      updateTranslationSpeechButton(true);
      try {
        window.speechSynthesis.speak(utterance);
      } catch (_error) {
        finish();
      }
    }

    function startTranslationThenSentence() {
      const expectedMode = sentenceAudioLoopMode;
      startTranslationSpeech({
        loopSequence: true,
        onComplete: () => {
          if (sentenceAudioLoopMode === expectedMode) scheduleSentenceAudioLoopPlayback(expectedMode);
        }
      });
    }

    function toggleTranslationSpeech() {
      if (!browserSpeechAvailable) return;
      if (translationSpeechActive) {
        stopBrowserSpeech();
        return;
      }
      stopSentenceAudio();
      startTranslationSpeech();
    }

    function updateGlossCount() {
      const entries = [...markedGlosses.values()];
      const vocabularyCount = entries.filter(({ reasons }) => reasons.includes("vocabulary")).length;
      const listeningCount = entries.filter(({ reasons }) => reasons.includes("listening")).length;
      glossCount.textContent = `★ ${vocabularyCount} · 🎧 ${listeningCount}`;
      glossCount.setAttribute(
        "aria-label",
        `${vocabularyCount} ${vocabularyCount === 1 ? "palavra para estudar" : "palavras para estudar"}; ${listeningCount} ${listeningCount === 1 ? "dificuldade de escuta" : "dificuldades de escuta"}`
      );
      updateGlossSpeechButton(markedGlossSpeechMode);
      updateSentenceAudioLoop();
    }

    glossSpeak.addEventListener("click", () => toggleMarkedGlossSpeech(false));
    glossSpeakJapanese.addEventListener("click", () => toggleMarkedGlossSpeech(true));
    translationSpeak.addEventListener("click", toggleTranslationSpeech);

    if (!Number.isInteger(currentFontLevel) || currentFontLevel < minFontLevel || currentFontLevel > maxFontLevel) {
      currentFontLevel = 0;
    }

    function updateFontLevel() {
      panel.dataset.fontLevel = String(currentFontLevel);
      chapterReader.dataset.fontLevel = String(currentFontLevel);
      fontLevel.value = `${fontPercentages[currentFontLevel + defaultFontLevelIndex]}%`;
      fontDecrease.disabled = currentFontLevel === minFontLevel;
      fontIncrease.disabled = currentFontLevel === maxFontLevel;
      localStorage.setItem("reading-font-level", String(currentFontLevel));
      if (readingMode === "vertical" && !chapterReader.hidden && chapterReadingText.childElementCount) {
        requestAnimationFrame(() => resetVerticalPagination(verticalPageIndex));
      }
      if (readingMode === "sentence" && selectedSentence.childNodes.length) {
        scheduleNextSentencePreview();
      }
    }

    fontDecrease.addEventListener("click", () => {
      currentFontLevel = Math.max(minFontLevel, currentFontLevel - 1);
      updateFontLevel();
    });

    fontIncrease.addEventListener("click", () => {
      currentFontLevel = Math.min(maxFontLevel, currentFontLevel + 1);
      updateFontLevel();
    });

    updateFontLevel();

    function toHiragana(value) {
      return value.replace(/[ァ-ヶ]/g, (character) =>
        String.fromCharCode(character.charCodeAt(0) - 0x60)
      );
    }

    function appendAlignedRuby(target, surface, reading) {
      const kanjiPattern = /^[\p{Script=Han}々〆ヵヶ0-9０-９]+$/u;
      const runs = surface.match(/[\p{Script=Han}々〆ヵヶ0-9０-９]+|[^\p{Script=Han}々〆ヵヶ0-9０-９]+/gu) || [surface];
      const normalizedReading = toHiragana(reading);
      let readingCursor = 0;

      runs.forEach((run, index) => {
        if (!kanjiPattern.test(run)) {
          target.append(document.createTextNode(run));
          const normalizedRun = toHiragana(run);
          if (normalizedReading.startsWith(normalizedRun, readingCursor)) {
            readingCursor += normalizedRun.length;
          }
          return;
        }

        const nextRun = runs[index + 1];
        const nextAnchor = nextRun && !kanjiPattern.test(nextRun)
          ? toHiragana(nextRun)
          : "";
        let readingEnd = nextAnchor
          ? normalizedReading.indexOf(nextAnchor, readingCursor)
          : normalizedReading.length;

        if (readingEnd < readingCursor) {
          readingEnd = normalizedReading.length;
        }

        const ruby = document.createElement("ruby");
        ruby.append(document.createTextNode(run));
        const rt = document.createElement("rt");
        rt.textContent = reading.slice(readingCursor, readingEnd);
        ruby.append(rt);
        target.append(ruby);
        readingCursor = readingEnd;
      });
    }

    function appendSentenceWithRuby(target, sentence) {
      let cursor = 0;
      sentence.chunks.forEach(([surface, reading]) => {
        const start = sentence.text.indexOf(surface, cursor);
        if (start > cursor) {
          target.append(document.createTextNode(sentence.text.slice(cursor, start)));
        }
        appendAlignedRuby(target, surface, reading);
        cursor = start + surface.length;
      });
      if (cursor < sentence.text.length) {
        target.append(document.createTextNode(sentence.text.slice(cursor)));
      }
    }

    function activeChapterForIndex(index) {
      let activeChapter = 0;
      chapterSentenceStarts.forEach((start, chapterIndex) => {
        if (start <= index) activeChapter = chapterIndex;
      });
      return activeChapter;
    }

    function updateFuriganaState() {
      try {
        localStorage.setItem(furiganaStorageKey, String(furiganaVisible));
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
      selectedSentence.classList.toggle("furigana-hidden", !furiganaVisible);
      chapterReadingText.classList.toggle("furigana-hidden", !furiganaVisible);
      selectedSentence.setAttribute("aria-pressed", String(furiganaVisible));
      chapterReadingText.setAttribute("aria-pressed", String(furiganaVisible));
      furiganaToggle.setAttribute("aria-pressed", String(furiganaVisible));
      chapterFuriganaToggle.setAttribute("aria-pressed", String(furiganaVisible));
      const toggleLabel = "ふりがな " + (furiganaVisible ? "ON" : "OFF");
      furiganaToggle.textContent = toggleLabel;
      chapterFuriganaToggle.textContent = toggleLabel;
      if (readingMode === "sentence" && selectedSentence.childNodes.length) {
        scheduleNextSentencePreview();
      }
    }

    function renderFullChapter(chapterIndex, restorePosition = true) {
      const storedPosition = readingPositions[readingMode];
      const sameChapter = storedPosition.chapterIndex === chapterIndex;
      if (!restorePosition || !sameChapter) {
        storedPosition.pageScrollY = 0;
        storedPosition.scrollLeft = null;
        storedPosition.verticalPageIndex = 0;
      }
      chapterReaderIndex = chapterIndex;
      storedPosition.chapterIndex = chapterIndex;
      saveReadingPositions();
      chapterSelect.value = String(chapterIndex);
      void updateOfflineControls();
      chapterReaderTitle.textContent = chapters[chapterIndex].title;
      chapterPreviousButton.disabled = chapterIndex === 0;
      chapterNextButton.disabled = chapterIndex === chapters.length - 1;
      chapterReader.classList.toggle("vertical", readingMode === "vertical");
      if (readingMode === "vertical") {
        chapterNextButton.textContent = "← 章";
        chapterPreviousButton.textContent = "章 →";
        chapterReaderToolbar.append(
          chapterNextButton,
          chapterReaderTitle,
          chapterFuriganaToggle,
          chapterPreviousButton
        );
      } else {
        chapterPreviousButton.textContent = "← 章";
        chapterNextButton.textContent = "章 →";
        chapterReaderToolbar.append(
          chapterPreviousButton,
          chapterReaderTitle,
          chapterFuriganaToggle,
          chapterNextButton
        );
      }
      verticalPageControls.hidden = readingMode !== "vertical";
      chapterSwipeHint.textContent = readingMode === "vertical"
        ? "Deslize o texto para a direita para avançar; deslize na barra acima para trocar de capítulo."
        : "Deslize para a direita para Frases ou para a esquerda para Vertical.";
      if (readingMode !== "vertical") {
        chapterReadingViewport.style.width = "";
        chapterReadingText.style.paddingLeft = "";
        chapterReadingText.style.paddingRight = "";
      }
      chapterReadingText.replaceChildren();
      chapters[chapterIndex].paragraphs.forEach((paragraph) => {
        const paragraphElement = document.createElement("p");
        paragraph.forEach((sentence) => appendSentenceWithRuby(paragraphElement, sentence));
        chapterReadingText.append(paragraphElement);
      });
      updateFuriganaState();
      const targetPageScrollY = storedPosition.pageScrollY;
      const targetScrollLeft = storedPosition.scrollLeft;
      const targetVerticalPage = storedPosition.verticalPageIndex;
      restoringReadingPosition = true;
      requestAnimationFrame(() => {
        chapterReadingViewport.scrollTop = 0;
        if (readingMode === "vertical") {
          resetVerticalPagination(targetVerticalPage);
        } else {
          chapterReadingViewport.scrollLeft = Number.isFinite(targetScrollLeft) ? targetScrollLeft : 0;
        }
        window.scrollTo(0, targetPageScrollY);
        restoringReadingPosition = false;
        captureReadingPosition();
      });
    }

    function setReadingMode(mode, persist = true) {
      const previousMode = readingMode;
      if (persist) captureReadingPosition(previousMode);
      readingMode = mode;
      if (persist) {
        try {
          localStorage.setItem(readingModeStorageKey, mode);
        } catch (_error) {
          // The reader remains usable when storage is unavailable.
        }
      }
      modeButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.readingMode === mode));
      });
      const sentenceMode = mode === "sentence";
      panel.hidden = !sentenceMode;
      studyHint.hidden = !sentenceMode;
      chapterReader.hidden = sentenceMode;
      if (sentenceMode) {
        renderCard(activeIndex);
        restoreSentencePosition();
      } else {
        stopSentenceAudio();
        stopBrowserSpeech();
        renderFullChapter(readingPositions[mode].chapterIndex);
      }
    }

    function navigateChapter(offset) {
      const currentChapter = chapterReaderIndex;
      const targetChapter = Math.min(Math.max(currentChapter + offset, 0), chapters.length - 1);
      if (targetChapter !== currentChapter) {
        captureReadingPosition();
        renderFullChapter(targetChapter, false);
      }
    }

    let verticalPageIndex = readingPositions.vertical.verticalPageIndex;
    let verticalPageCount = 1;
    let verticalPageWidth = 1;
    let verticalStartScrollLeft = 0;

    function updateVerticalPageControls() {
      verticalPagePrevious.disabled = verticalPageIndex === 0;
      verticalPageNext.disabled = verticalPageIndex === verticalPageCount - 1;
      verticalPageStatus.textContent = `Página ${verticalPageIndex + 1} de ${verticalPageCount}`;
    }

    function hideClippedVerticalFurigana() {
      const viewportRect = chapterReadingViewport.getBoundingClientRect();
      chapterReadingText.querySelectorAll("rt").forEach((annotation) => {
        annotation.style.visibility = "";
        if (!furiganaVisible) return;
        const rect = annotation.getBoundingClientRect();
        const verticallyVisible = rect.bottom > viewportRect.top && rect.top < viewportRect.bottom;
        if (verticallyVisible && (rect.left < viewportRect.left || rect.right > viewportRect.right)) {
          annotation.style.visibility = "hidden";
        }
      });
    }

    function applyVerticalPage(pageIndex) {
      verticalPageIndex = Math.min(Math.max(pageIndex, 0), verticalPageCount - 1);
      chapterReadingViewport.scrollLeft = verticalStartScrollLeft - (verticalPageIndex * verticalPageWidth);
      hideClippedVerticalFurigana();
      readingPositions.vertical.verticalPageIndex = verticalPageIndex;
      updateVerticalPageControls();
    }

    function resetVerticalPagination(pageIndex = verticalPageIndex) {
      if (readingMode !== "vertical") return;
      chapterReadingText.style.paddingLeft = "0px";
      chapterReadingText.style.paddingRight = "0px";
      chapterReadingViewport.style.width = "";
      const availableWidth = Math.max(chapterReadingViewport.clientWidth, 1);
      const columnWidth = Math.max(Number.parseFloat(getComputedStyle(chapterReadingText).lineHeight), 1);
      const availableColumns = Math.max(Math.floor(availableWidth / columnWidth), 1);
      const gutterColumns = availableColumns >= 3 ? 1 : 0;
      const readableColumns = Math.max(availableColumns - (gutterColumns * 2), 1);
      const gutterWidth = gutterColumns * columnWidth;
      verticalPageWidth = readableColumns * columnWidth;
      chapterReadingViewport.style.width = `${verticalPageWidth + (gutterWidth * 2)}px`;
      chapterReadingViewport.style.setProperty("--vertical-page-gutter", `${gutterWidth}px`);
      const contentWidth = chapterReadingText.scrollWidth;
      verticalPageCount = Math.max(1, Math.ceil(contentWidth / verticalPageWidth));
      const paddedPagesWidth = (verticalPageCount * verticalPageWidth) + (gutterWidth * 2);
      chapterReadingText.style.paddingRight = `${gutterWidth}px`;
      chapterReadingText.style.paddingLeft = `${Math.max(paddedPagesWidth - contentWidth - gutterWidth, gutterWidth)}px`;
      chapterReadingViewport.scrollLeft = chapterReadingViewport.scrollWidth;
      verticalStartScrollLeft = chapterReadingViewport.scrollLeft;
      applyVerticalPage(pageIndex);
    }

    function navigateVerticalPage(offset) {
      if (readingMode !== "vertical") return;
      applyVerticalPage(verticalPageIndex + offset);
      captureReadingPosition();
    }

    function finalBaseCharacterRect() {
      const walker = document.createTreeWalker(selectedSentence, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || node.parentElement?.closest("rt, .next-sentence-preview")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      let node = null;
      let lastNode = null;
      while ((node = walker.nextNode())) lastNode = node;
      if (!lastNode) return null;

      const range = document.createRange();
      range.setStart(lastNode, lastNode.nodeValue.length - 1);
      range.setEnd(lastNode, lastNode.nodeValue.length);
      const rects = range.getClientRects();
      return rects.length ? rects[rects.length - 1] : null;
    }

    function fittingPreviewPrefix(text, availableWidth) {
      const measure = document.createElement("span");
      measure.className = "next-sentence-preview measure";
      measure.setAttribute("aria-hidden", "true");
      selectedSentence.append(measure);

      let low = 0;
      let high = [...text].length;
      const characters = [...text];
      while (low < high) {
        const middle = Math.ceil((low + high) / 2);
        measure.textContent = characters.slice(0, middle).join("");
        if (measure.getBoundingClientRect().width <= availableWidth) {
          low = middle;
        } else {
          high = middle - 1;
        }
      }
      measure.remove();
      return characters.slice(0, low).join("");
    }

    function renderNextSentencePreview() {
      selectedSentence.querySelector(".next-sentence-preview")?.remove();
      const activeParagraph = sentenceParagraphIndexes[activeIndex];
      const sentenceInParagraph = activeIndex - paragraphSentenceStarts[activeParagraph];
      const sentencesInParagraph = paragraphSentenceCounts[activeParagraph];
      if (sentenceInParagraph >= sentencesInParagraph - 1 || activeIndex >= sentences.length - 1) return;

      const finalCharacterRect = finalBaseCharacterRect();
      if (!finalCharacterRect) return;
      const sentenceRect = selectedSentence.getBoundingClientRect();
      const fontSize = Number.parseFloat(getComputedStyle(selectedSentence).fontSize);
      const gapWidth = fontSize * 0.4;
      const availableWidth = sentenceRect.right - finalCharacterRect.right - gapWidth - 1;
      if (availableWidth <= 0) return;

      const previewText = fittingPreviewPrefix(sentences[activeIndex + 1].text, availableWidth);
      if (!previewText) return;
      const preview = document.createElement("span");
      preview.className = "next-sentence-preview";
      preview.setAttribute("aria-hidden", "true");
      preview.textContent = previewText;
      selectedSentence.append(preview);
    }

    function scheduleNextSentencePreview() {
      if (nextSentencePreviewFrame !== null) cancelAnimationFrame(nextSentencePreviewFrame);
      const renderedIndex = activeIndex;
      nextSentencePreviewFrame = requestAnimationFrame(() => {
        nextSentencePreviewFrame = null;
        if (readingMode === "sentence" && activeIndex === renderedIndex) {
          renderNextSentencePreview();
        }
      });
    }

    function renderCard(index) {
      stopSentenceAudio();
      stopBrowserSpeech();
      activeIndex = index;
      saveActiveIndex();
      const sentence = sentences[activeIndex];
      const activeParagraph = sentenceParagraphIndexes[activeIndex];
      const sentenceInParagraph = activeIndex - paragraphSentenceStarts[activeParagraph];
      const sentencesInParagraph = paragraphSentenceCounts[activeParagraph];
      previousParagraphButton.disabled = activeParagraph === 0;
      previousButton.disabled = activeIndex === 0;
      nextButton.disabled = activeIndex === sentences.length - 1;
      nextParagraphButton.disabled = activeParagraph === paragraphs.length - 1;
      let activeChapter = 0;
      chapterSentenceStarts.forEach((start, index) => {
        if (start <= activeIndex) activeChapter = index;
      });
      const paragraphInChapter = activeParagraph - chapterParagraphStarts[activeChapter];
      prepareSentenceAudio(activeChapter, paragraphInChapter, sentenceInParagraph);
      chapterSelect.value = String(activeChapter);
      void updateOfflineControls();
      label.textContent = `Parágrafo ${paragraphInChapter + 1} de ${chapterParagraphCounts[activeChapter]} · frase ${sentenceInParagraph + 1} de ${sentencesInParagraph}`;
      selectedSentence.classList.toggle("paragraph-start", sentenceInParagraph === 0);
      selectedSentence.replaceChildren();

      let cursor = 0;
      sentence.chunks.forEach(([surface, reading]) => {
        const start = sentence.text.indexOf(surface, cursor);
        if (start > cursor) {
          selectedSentence.append(document.createTextNode(sentence.text.slice(cursor, start)));
        }

        appendAlignedRuby(selectedSentence, surface, reading);
        cursor = start + surface.length;
      });

      if (cursor < sentence.text.length) {
        selectedSentence.append(document.createTextNode(sentence.text.slice(cursor)));
      }
      scheduleNextSentencePreview();

      sentenceTranslation.textContent = sentence.pt;
      interlinear.replaceChildren();

      sentence.chunks.forEach(([surface, reading, gloss]) => {
        const chunk = document.createElement("div");
        chunk.className = "chunk";

        const vocabularyButton = document.createElement("button");
        vocabularyButton.className = "chunk-vocabulary";
        vocabularyButton.type = "button";
        vocabularyButton.setAttribute("aria-label", `${surface}: ${gloss}. Alternar vocabulário e dificuldade de escuta.`);

        const japanese = document.createElement("span");
        japanese.className = "chunk-japanese";
        appendAlignedRuby(japanese, surface, reading);

        const meaning = document.createElement("span");
        meaning.className = "gloss";
        meaning.lang = "pt-BR";
        meaning.textContent = gloss;
        vocabularyButton.append(japanese, meaning);

        const reasonControls = document.createElement("div");
        reasonControls.className = "chunk-reasons";
        reasonControls.setAttribute("role", "group");
        reasonControls.setAttribute("aria-label", `Motivos para marcar ${surface}`);

        const vocabularyReason = document.createElement("button");
        vocabularyReason.className = "chunk-reason";
        vocabularyReason.type = "button";
        vocabularyReason.textContent = "★";
        vocabularyReason.title = "Vocabulário";
        vocabularyReason.setAttribute("aria-label", `Marcar ${surface} como vocabulário`);

        const listeningReason = document.createElement("button");
        listeningReason.className = "chunk-reason";
        listeningReason.type = "button";
        listeningReason.textContent = "🎧";
        listeningReason.title = "Dificuldade de escuta";
        listeningReason.setAttribute("aria-label", `Marcar ${surface} como dificuldade de escuta`);
        reasonControls.append(vocabularyReason, listeningReason);

        function updateChunkReasons() {
          const vocabularyMarked = hasGlossReason(surface, gloss, "vocabulary");
          const listeningMarked = hasGlossReason(surface, gloss, "listening");
          chunk.dataset.vocabulary = String(vocabularyMarked);
          chunk.dataset.listening = String(listeningMarked);
          vocabularyButton.setAttribute("aria-pressed", String(vocabularyMarked && listeningMarked));
          vocabularyReason.setAttribute("aria-pressed", String(vocabularyMarked));
          listeningReason.setAttribute("aria-pressed", String(listeningMarked));
        }

        function toggleReason(reason) {
          toggleGlossReason(surface, gloss, reason);
          updateChunkReasons();
        }

        vocabularyButton.addEventListener("click", () => {
          toggleAllGlossReasons(surface, gloss);
          updateChunkReasons();
        });
        vocabularyReason.addEventListener("click", () => toggleReason("vocabulary"));
        listeningReason.addEventListener("click", () => toggleReason("listening"));
        updateChunkReasons();
        chunk.append(vocabularyButton, reasonControls);
        interlinear.append(chunk);
      });
      updateGlossSpeechButton(false);
      updateSentenceAudioLoop();
    }

    glossExport.addEventListener("click", () => {
      captureReadingPosition();
      const payload = {
        schema_version: 3,
        source_file: bookData?.source_file || null,
        exported_at: new Date().toISOString(),
        reader_state: {
          reading_mode: readingMode,
          active_sentence_index: activeIndex,
          sentence_chapter_positions: sentenceChapterPositions,
          font_level: currentFontLevel,
          furigana_visible: furiganaVisible,
          positions: readingPositions
        },
        glosses: [...markedGlosses.values()]
      };
      const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "dados-de-leitura.json";
      link.click();
      URL.revokeObjectURL(url);
    });

    glossImport.addEventListener("click", () => glossImportFile.click());

    glossImportFile.addEventListener("change", async () => {
      const [file] = glossImportFile.files;
      if (!file) return;
      try {
        const payload = JSON.parse(await file.text());
        if (![1, 2, 3].includes(payload?.schema_version) || !Array.isArray(payload.glosses)) {
          throw new Error("Formato incompatível");
        }
        const imported = payload.glosses.map((entry) => {
          const normalized = normalizeGlossEntry(entry);
          if (!normalized) throw new Error("Gloss inválido");
          return normalized;
        });
        let importedReaderState = null;
        if ([2, 3].includes(payload.schema_version)) {
          const state = payload.reader_state;
          const storedSentenceChapterPositions = state?.sentence_chapter_positions;
          if (payload.source_file !== bookData?.source_file
            || !state || typeof state !== "object"
            || !["sentence", "continuous", "vertical"].includes(state.reading_mode)
            || !Number.isInteger(state.active_sentence_index)
            || (storedSentenceChapterPositions !== undefined
              && !validSentenceChapterPositions(storedSentenceChapterPositions))
            || !Number.isInteger(state.font_level)
            || state.font_level < minFontLevel || state.font_level > maxFontLevel
            || typeof state.furigana_visible !== "boolean"
            || !state.positions || typeof state.positions !== "object") {
            throw new Error("Estado de leitura inválido");
          }
          const importedActiveIndex = Math.min(
            Math.max(state.active_sentence_index, 0),
            sentences.length - 1
          );
          importedReaderState = {
            activeIndex: importedActiveIndex,
            sentenceChapterPositions: normalizeSentenceChapterPositions(
              storedSentenceChapterPositions,
              importedActiveIndex
            ),
            readingMode: state.reading_mode,
            fontLevel: state.font_level,
            furiganaVisible: state.furigana_visible,
            positions: normalizeReadingPositions(state.positions)
          };
        }

        markedGlosses = new Map(imported.map((entry) => [
          glossKey(entry.term, entry.portuguese),
          entry
        ]));
        saveMarkedGlosses();

        if (importedReaderState) {
          activeIndex = importedReaderState.activeIndex;
          sentenceChapterPositions = importedReaderState.sentenceChapterPositions;
          readingMode = importedReaderState.readingMode;
          currentFontLevel = importedReaderState.fontLevel;
          furiganaVisible = importedReaderState.furiganaVisible;
          readingPositions = importedReaderState.positions;
          chapterReaderIndex = readingPositions[readingMode === "sentence" ? "continuous" : readingMode].chapterIndex;
          saveActiveIndex();
          saveReadingPositions();
          localStorage.setItem(readingModeStorageKey, readingMode);
          updateFontLevel();
          updateFuriganaState();
          setReadingMode(readingMode, false);
        } else if (readingMode === "sentence") {
          renderCard(activeIndex);
        } else {
          renderFullChapter(chapterReaderIndex);
        }
      } catch (_error) {
        window.alert("O arquivo não é um JSON de dados de leitura válido para este livro.");
      } finally {
        glossImportFile.value = "";
      }
    });

    function showPreviousSentence() {
      if (activeIndex > 0) {
        renderCard(activeIndex - 1);
      }
    }

    function showNextSentence() {
      if (activeIndex < sentences.length - 1) {
        renderCard(activeIndex + 1);
      }
    }

    previousButton.addEventListener("click", showPreviousSentence);

    previousParagraphButton.addEventListener("click", () => {
      const activeParagraph = sentenceParagraphIndexes[activeIndex];
      if (activeParagraph > 0) {
        renderCard(paragraphSentenceStarts[activeParagraph - 1]);
      }
    });

    nextButton.addEventListener("click", showNextSentence);

    nextParagraphButton.addEventListener("click", () => {
      const activeParagraph = sentenceParagraphIndexes[activeIndex];
      if (activeParagraph < paragraphs.length - 1) {
        renderCard(paragraphSentenceStarts[activeParagraph + 1]);
      }
    });

    const swipeThreshold = 50;
    let swipePointerId = null;
    let swipeStartX = 0;
    let swipeStartY = 0;
    let suppressClickAfterSwipe = false;

    panel.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" || !event.isPrimary) return;
      swipePointerId = event.pointerId;
      swipeStartX = event.clientX;
      swipeStartY = event.clientY;
    });

    panel.addEventListener("pointerup", (event) => {
      if (event.pointerId !== swipePointerId) return;
      const horizontalDistance = event.clientX - swipeStartX;
      const verticalDistance = event.clientY - swipeStartY;
      swipePointerId = null;

      if (
        Math.abs(horizontalDistance) < swipeThreshold
        || Math.abs(horizontalDistance) <= Math.abs(verticalDistance) * 1.25
      ) return;

      event.preventDefault();
      suppressClickAfterSwipe = true;
      setTimeout(() => { suppressClickAfterSwipe = false; }, 0);
      if (horizontalDistance < 0) {
        showNextSentence();
      } else {
        showPreviousSentence();
      }
    });

    panel.addEventListener("pointercancel", (event) => {
      if (event.pointerId === swipePointerId) swipePointerId = null;
    });

    panel.addEventListener("click", (event) => {
      if (!suppressClickAfterSwipe) return;
      suppressClickAfterSwipe = false;
      event.preventDefault();
      event.stopPropagation();
    }, true);

    chapterSelect.addEventListener("change", () => {
      const chapterIndex = Number(chapterSelect.value);
      if (readingMode === "sentence") {
        renderCard(sentenceChapterPositions[chapterIndex]);
      } else {
        captureReadingPosition();
        renderFullChapter(chapterIndex, false);
      }
    });

    function toggleFurigana() {
      furiganaVisible = !furiganaVisible;
      updateFuriganaState();
    }

    furiganaToggle.addEventListener("click", toggleFurigana);
    selectedSentence.addEventListener("click", toggleFurigana);
    selectedSentence.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggleFurigana();
    });

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => setReadingMode(button.dataset.readingMode));
    });

    chapterPreviousButton.addEventListener("click", () => navigateChapter(-1));
    chapterNextButton.addEventListener("click", () => navigateChapter(1));
    verticalPagePrevious.addEventListener("click", () => navigateVerticalPage(-1));
    verticalPageNext.addEventListener("click", () => navigateVerticalPage(1));
    chapterFuriganaToggle.addEventListener("click", toggleFurigana);
    chapterReadingText.addEventListener("click", toggleFurigana);
    chapterReadingText.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" && readingMode === "vertical") {
        event.preventDefault();
        navigateVerticalPage(1);
      } else if (event.key === "ArrowLeft" && readingMode === "vertical") {
        event.preventDefault();
        navigateVerticalPage(-1);
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleFurigana();
      }
    });

    let chapterSwipePointerId = null;
    let chapterSwipeStartX = 0;
    let chapterSwipeStartY = 0;
    let suppressChapterClick = false;

    chapterReader.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" || !event.isPrimary) return;
      if (readingMode === "vertical" && !event.target.closest(".chapter-reader-toolbar")) return;
      chapterSwipePointerId = event.pointerId;
      chapterSwipeStartX = event.clientX;
      chapterSwipeStartY = event.clientY;
    });

    chapterReader.addEventListener("pointerup", (event) => {
      if (event.pointerId !== chapterSwipePointerId) return;
      const horizontalDistance = event.clientX - chapterSwipeStartX;
      const verticalDistance = event.clientY - chapterSwipeStartY;
      chapterSwipePointerId = null;
      if (Math.abs(horizontalDistance) < swipeThreshold
        || Math.abs(horizontalDistance) <= Math.abs(verticalDistance) * 1.25) return;
      event.preventDefault();
      suppressChapterClick = true;
      setTimeout(() => { suppressChapterClick = false; }, 0);
      if (readingMode === "continuous") {
        setReadingMode(horizontalDistance < 0 ? "vertical" : "sentence");
      } else {
        navigateChapter(horizontalDistance < 0 ? 1 : -1);
      }
    });

    chapterReader.addEventListener("pointercancel", (event) => {
      if (event.pointerId === chapterSwipePointerId) chapterSwipePointerId = null;
    });

    chapterReader.addEventListener("click", (event) => {
      if (!suppressChapterClick) return;
      suppressChapterClick = false;
      event.preventDefault();
      event.stopPropagation();
    }, true);

    let verticalPageSwipePointerId = null;
    let verticalPageSwipeStartX = 0;
    let verticalPageSwipeStartY = 0;

    chapterReadingViewport.addEventListener("pointerdown", (event) => {
      if (readingMode !== "vertical" || event.pointerType === "mouse" || !event.isPrimary) return;
      verticalPageSwipePointerId = event.pointerId;
      verticalPageSwipeStartX = event.clientX;
      verticalPageSwipeStartY = event.clientY;
    });

    chapterReadingViewport.addEventListener("pointerup", (event) => {
      if (event.pointerId !== verticalPageSwipePointerId) return;
      const horizontalDistance = event.clientX - verticalPageSwipeStartX;
      const verticalDistance = event.clientY - verticalPageSwipeStartY;
      verticalPageSwipePointerId = null;
      if (Math.abs(horizontalDistance) < swipeThreshold
        || Math.abs(horizontalDistance) <= Math.abs(verticalDistance) * 1.25) return;
      event.preventDefault();
      suppressChapterClick = true;
      setTimeout(() => { suppressChapterClick = false; }, 0);
      navigateVerticalPage(horizontalDistance > 0 ? 1 : -1);
    });

    chapterReadingViewport.addEventListener("pointercancel", (event) => {
      if (event.pointerId === verticalPageSwipePointerId) verticalPageSwipePointerId = null;
    });

    window.addEventListener("scroll", scheduleReadingPositionSave, { passive: true });
    chapterReadingViewport.addEventListener("scroll", scheduleReadingPositionSave, { passive: true });
    window.addEventListener("resize", () => {
      if (readingMode === "vertical") requestAnimationFrame(() => resetVerticalPagination(verticalPageIndex));
      if (readingMode === "sentence") scheduleNextSentencePreview();
    });
    window.addEventListener("pagehide", () => {
      captureReadingPosition();
      stopSentenceAudio();
      stopBrowserSpeech();
    });

    updateGlossCount();
    updateTranslationSpeechButton(false);
    void initializeOfflineControls();
    updateFuriganaState();
    setReadingMode(readingMode, false);
  </script>
</body>
</html>
