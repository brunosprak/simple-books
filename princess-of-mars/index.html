<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="火星を舞台にした冒険小説を、読みやすい現代日本語で楽しめます。">
  <title>火星のプリンセス</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f3efe4;
      --ink: #22231f;
      --muted: #696a62;
      --rule: #b3ad9f;
      --accent: #314f46;
      --accent-soft: rgb(49 79 70 / 11%);
      --panel: #e9e4d7;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgb(49 79 70 / 8%), transparent 28rem),
        var(--paper);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      line-height: 2;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100% - 2.5rem, 45rem);
      margin: 0 auto;
      padding: clamp(4rem, 12vw, 8rem) 0 8rem;
    }

    header {
      margin-bottom: 4rem;
      padding-bottom: 2.25rem;
      border-bottom: 1px solid var(--rule);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--accent);
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4.25rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.25;
    }

    .author {
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .reader-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.45rem;
      margin-top: 1.75rem;
      font-family: system-ui, sans-serif;
    }

    .reader-controls-label {
      margin-right: 0.25rem;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    .font-button {
      min-width: 2.4rem;
      height: 2.2rem;
      padding: 0 0.55rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .font-button:hover,
    .font-button:focus-visible {
      color: var(--paper);
      background: var(--accent);
      border-color: var(--accent);
      outline: none;
    }

    .font-button:disabled {
      color: var(--muted);
      background: transparent;
      border-color: var(--rule);
      cursor: not-allowed;
      opacity: 0.4;
    }

    .font-level {
      min-width: 3.4rem;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
    }

    h2 {
      margin: 0 0 2.25rem;
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .chapter-select {
      width: 100%;
      padding: 0.25rem 2.2rem 0.25rem 0;
      color: var(--accent);
      background: transparent;
      border: 0;
      border-bottom: 1px solid transparent;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }

    .chapter-select:hover,
    .chapter-select:focus-visible {
      border-bottom-color: var(--accent);
      outline: none;
    }

    p {
      margin: 0 0 1.75rem;
      font-size: clamp(1rem, 2.5vw, 1.1rem);
      letter-spacing: 0.025em;
      text-align: justify;
    }

    p + p {
      text-indent: 1em;
    }

    .reading-mode-switch {
      position: sticky;
      top: 0.5rem;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45rem;
      margin: -1rem 0 2rem;
      padding: 0.45rem;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
      border-radius: 999px;
      box-shadow: 0 0.35rem 1.2rem rgb(20 25 22 / 8%);
      font-family: system-ui, sans-serif;
      backdrop-filter: blur(0.6rem);
    }

    .reading-mode-button {
      min-height: 2.6rem;
      padding: 0.45rem 0.65rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .reading-mode-button[aria-pressed="true"] {
      color: var(--paper);
      background: var(--accent);
      border-color: var(--accent);
    }

    .reading-mode-button:hover,
    .reading-mode-button:focus-visible { border-color: var(--accent); outline: none; }

    .chapter-reader {
      margin: 0.5rem 0 2.5rem;
      padding: clamp(1.25rem, 4vw, 2rem);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      box-shadow: 0 1rem 2.5rem rgb(20 25 22 / 8%);
      font-size: 100%;
      touch-action: pan-y;
    }

    .chapter-reader-toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--rule);
      font-family: system-ui, sans-serif;
      touch-action: pan-y;
    }

    .chapter-reader-title {
      min-width: 0;
      flex: 1;
      margin: 0;
      overflow: hidden;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter-nav-button {
      min-width: 2.6rem;
      height: 2.35rem;
      padding: 0 0.65rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chapter-nav-button:disabled { cursor: not-allowed; opacity: 0.35; }
    .chapter-reading-viewport { max-width: 100%; }

    .chapter-reading-text {
      font-size: 1.1em;
      cursor: pointer;
      line-height: 2.25;
    }
    .chapter-reading-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 0.4rem; }
    .chapter-reading-text p {
      margin-bottom: 1.75rem;
      font-size: inherit;
    }
    .chapter-reading-text rt {
      color: var(--accent);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 0.52em;
      font-weight: 500;
    }
    .chapter-reading-text.furigana-hidden rt { visibility: hidden; }
    .chapter-reader.vertical { touch-action: auto; }
    .chapter-reader.vertical .chapter-reading-viewport {
      height: min(72vh, 44rem);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.5rem;
      overscroll-behavior-x: contain;
    }
    .chapter-reader.vertical .chapter-reading-text {
      width: max-content;
      min-width: 100%;
      height: 100%;
      padding-left: 1rem;
      line-height: 2.25;
      text-orientation: mixed;
      writing-mode: vertical-rl;
    }
    .chapter-reader.vertical .chapter-reading-text p {
      margin: 0 0 0 2em;
      text-align: justify;
    }
    .chapter-swipe-hint {
      margin: 1rem 0 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.68rem;
      text-align: center;
    }
    .chapter-reader[data-font-level="-2"] { font-size: 80%; }
    .chapter-reader[data-font-level="-1"] { font-size: 90%; }
    .chapter-reader[data-font-level="1"] { font-size: 110%; }
    .chapter-reader[data-font-level="2"] { font-size: 120%; }
    .chapter-reader[data-font-level="3"] { font-size: 140%; }
    .chapter-reader[data-font-level="4"] { font-size: 160%; }

    .study-panel {
      font-size: 100%;
    }

    .study-panel[data-font-level="-2"] {
      font-size: 80%;
    }

    .study-panel[data-font-level="-1"] {
      font-size: 90%;
    }

    .study-panel[data-font-level="1"] {
      font-size: 110%;
    }

    .study-panel[data-font-level="2"] {
      font-size: 120%;
    }

    .study-panel[data-font-level="3"] {
      font-size: 140%;
    }

    .study-panel[data-font-level="4"] {
      font-size: 160%;
    }

    .study-hint {
      margin: -1.25rem 0 2rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      text-align: left;
    }

    .study-panel {
      margin: 0.5rem 0 2.5rem;
      padding: clamp(1.25rem, 4vw, 2rem);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      box-shadow: 0 1rem 2.5rem rgb(20 25 22 / 8%);
      text-indent: 0;
      touch-action: pan-y;
    }

    .study-topline {
      position: sticky;
      top: 0.5rem;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: -0.75rem -0.75rem 1rem;
      padding: 0.75rem;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
      border-radius: 0.5rem;
      box-shadow: 0 0.35rem 1.2rem rgb(20 25 22 / 8%);
      backdrop-filter: blur(0.6rem);
    }

    .study-label {
      margin: 0;
      color: var(--accent);
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .study-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .study-nav {
      min-width: 2rem;
      height: 2rem;
      padding: 0 0.55rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .furigana-toggle {
      min-width: 6.4rem;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }

    .study-nav:hover,
    .study-nav:focus-visible {
      color: var(--ink);
      border-color: var(--accent);
      outline: none;
    }

    .study-nav:disabled {
      color: var(--muted);
      border-color: var(--rule);
      cursor: not-allowed;
      opacity: 0.35;
    }

    .paragraph-boundary {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0 1rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .paragraph-boundary::before,
    .paragraph-boundary::after {
      height: 1px;
      flex: 1;
      background: var(--rule);
      content: "";
    }

    .paragraph-end {
      margin: 1.25rem 0 0;
      padding-top: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--rule);
      font-family: system-ui, sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .paragraph-boundary[hidden],
    .paragraph-end[hidden] {
      display: none;
    }

    .selected-sentence {
      margin: 0 0 0.65rem;
      cursor: pointer;
      font-size: 1.35em;
      font-weight: 600;
      line-height: 2.5;
      text-align: left;
    }

    .selected-sentence:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 0.35rem;
    }

    .selected-sentence ruby {
      ruby-align: center;
    }

    .selected-sentence rt {
      color: var(--accent);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 0.52em;
      font-weight: 500;
    }

    .selected-sentence.furigana-hidden rt {
      visibility: hidden;
    }

    .sentence-translation {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.88em;
      line-height: 1.55;
      text-align: left;
    }

    .interlinear {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem 0.55rem;
    }

    .chunk {
      display: inline-flex;
      min-width: 3rem;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.55rem 0.65rem 0.5rem;
      background: color-mix(in srgb, var(--paper) 72%, transparent);
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: 0.35rem;
      font-family: inherit;
      text-align: center;
      cursor: pointer;
    }

    .chunk:hover,
    .chunk:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .chunk[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .chunk-japanese {
      font-size: 1.05em;
      font-weight: 600;
      line-height: 1.6;
    }

    .chunk rt {
      color: var(--accent);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 0.6em;
      font-weight: 500;
    }

    .gloss {
      max-width: 12rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.7em;
      line-height: 1.3;
    }

    .gloss-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0 0 0.9rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
    }

    .gloss-count {
      margin-right: auto;
    }

    .gloss-tool-button {
      padding: 0.25rem 0.55rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font: inherit;
      font-size: 0.85em;
      font-weight: 700;
      cursor: pointer;
    }

    .gloss-tool-button:hover,
    .gloss-tool-button:focus-visible {
      color: var(--paper);
      background: var(--accent);
      border-color: var(--accent);
      outline: none;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    @media (min-width: 48rem) {
      main {
        width: min(100% - 4rem, 68rem);
        padding-top: 5rem;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 3rem;
        align-items: end;
      }

      .eyebrow {
        grid-column: 1 / -1;
      }

      h1,
      .author {
        grid-column: 1;
      }

      .reader-controls {
        grid-column: 2;
        grid-row: 2 / 4;
        align-self: end;
        margin: 0 0 0.1rem;
      }

      .study-panel {
        min-height: 25rem;
        padding: 2.5rem 3rem 2.75rem;
        border-radius: 0.75rem;
      }

      .study-topline {
        margin-bottom: 1.75rem;
      }

      .study-nav {
        min-width: 3rem;
        height: 2.5rem;
      }

      .furigana-toggle {
        min-width: 7rem;
      }

      .selected-sentence {
        margin-bottom: 1.5rem;
        padding: 0.75rem 0 1.75rem;
        border-bottom: 1px solid var(--rule);
        line-height: 2.7;
      }

      .interlinear {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
        align-items: stretch;
        gap: 0.75rem;
      }

      .chunk {
        min-width: 0;
        justify-content: center;
        padding: 0.85rem 0.9rem 0.75rem;
      }

      .sentence-translation {
        max-width: 52rem;
        margin-top: 2rem;
        font-size: 0.95em;
      }
    }

    @media (max-width: 36rem) {
      main {
        width: min(100% - 1.25rem, 45rem);
        padding-top: 1rem;
      }

      header {
        margin-bottom: 1.25rem;
        padding-bottom: 1rem;
      }

      .eyebrow {
        margin-bottom: 0.45rem;
        font-size: 0.62rem;
        letter-spacing: 0.17em;
      }

      h1 {
        font-size: clamp(1.85rem, 9vw, 2.6rem);
        line-height: 1.15;
      }

      .author {
        margin-top: 0.5rem;
        font-size: 0.82rem;
      }

      .reader-controls {
        justify-content: flex-start;
        gap: 0.35rem;
        margin-top: 0.75rem;
      }

      .reader-controls-label {
        margin-right: auto;
        font-size: 0.65rem;
      }

      .font-button {
        min-width: 2.2rem;
        height: 2rem;
        padding: 0 0.45rem;
      }

      .font-level {
        min-width: 2.8rem;
      }

      h2 {
        margin-bottom: 1rem;
        font-size: 1.05rem;
      }

      .study-hint {
        margin: -0.35rem 0 0.8rem;
      }

      .study-topline {
        align-items: flex-start;
        flex-direction: column;
      }

      .study-actions {
        width: 100%;
      }

      .study-nav {
        flex: 1;
        min-height: 2.75rem;
      }

      .furigana-toggle {
        flex: 1.65;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #171a18;
        --ink: #e7e3d8;
        --muted: #aaa99f;
        --rule: #414641;
        --accent: #92b3a7;
        --accent-soft: rgb(146 179 167 / 13%);
        --panel: #222724;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .study-panel {
        animation: reveal 160ms ease-out;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(-0.35rem);
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow" id="page-eyebrow">日本語で読む世界の名作</p>
      <h1 id="page-title">火星のプリンセス</h1>
      <p class="author" id="page-author">エドガー・ライス・バローズ</p>
      <div class="reader-controls" aria-label="Controles de tamanho do texto">
        <span class="reader-controls-label">文字サイズ</span>
        <button class="font-button" id="font-decrease" type="button" aria-label="Diminuir o texto japonês">A−</button>
        <output class="font-level" id="font-level" aria-live="polite">100%</output>
        <button class="font-button" id="font-increase" type="button" aria-label="Aumentar o texto japonês">A＋</button>
      </div>
    </header>

    <article>
      <h2><select class="chapter-select" id="chapter-select" aria-label="Selecionar capítulo"><option>Capítulo</option></select></h2>

      <nav class="reading-mode-switch" aria-label="Modo de leitura">
        <button class="reading-mode-button" type="button" data-reading-mode="sentence" aria-pressed="true">Frases</button>
        <button class="reading-mode-button" type="button" data-reading-mode="continuous" aria-pressed="false">Corrido</button>
        <button class="reading-mode-button" type="button" data-reading-mode="vertical" aria-pressed="false">Vertical</button>
      </nav>

      <p class="study-hint" id="study-hint">文を選ぶと、日本語の読み方とポルトガル語の意味を確認できます。</p>

      <noscript><p>このページを表示するにはJavaScriptを有効にしてください。</p></noscript>

      <section class="study-panel" id="study-panel" aria-live="polite">
        <div class="study-topline">
          <p class="study-label" id="study-label">Interlinear</p>
          <div class="study-actions" aria-label="Navegação entre frases e parágrafos">
            <button class="study-nav" id="study-previous-paragraph" type="button" aria-label="Parágrafo anterior" title="Parágrafo anterior">−1¶</button>
            <button class="study-nav" id="study-previous" type="button" aria-label="Frase anterior">←</button>
            <button class="study-nav furigana-toggle" id="furigana-toggle" type="button" aria-pressed="true">ふりがな ON</button>
            <button class="study-nav" id="study-next" type="button" aria-label="Próxima frase">→</button>
            <button class="study-nav" id="study-next-paragraph" type="button" aria-label="Próximo parágrafo" title="Próximo parágrafo">＋1¶</button>
          </div>
        </div>
        <div class="gloss-tools" aria-label="Glosses marcados">
          <span class="gloss-count" id="gloss-count">0 glosses marcados</span>
          <button class="gloss-tool-button" id="gloss-export" type="button" aria-label="Exportar dados de leitura em JSON" title="Exportar dados de leitura em JSON">↓ JSON</button>
          <button class="gloss-tool-button" id="gloss-import" type="button" aria-label="Importar dados de leitura em JSON" title="Importar dados de leitura em JSON">↑ JSON</button>
          <input id="gloss-import-file" type="file" accept="application/json,.json" hidden>
        </div>
        <p class="paragraph-boundary" id="paragraph-boundary" hidden>Novo parágrafo</p>
        <p class="selected-sentence" id="selected-sentence" lang="ja" role="button" tabindex="0" aria-label="Alternar furigana" aria-pressed="true"></p>
        <p class="paragraph-end" id="paragraph-end" hidden>Fim do parágrafo</p>
        <div class="interlinear" id="interlinear"></div>
        <p class="sentence-translation" id="sentence-translation" lang="pt-BR"></p>
      </section>

      <section class="chapter-reader" id="chapter-reader" aria-live="polite" hidden>
        <div class="chapter-reader-toolbar">
          <button class="chapter-nav-button" id="chapter-previous" type="button" aria-label="Capítulo anterior">← 章</button>
          <p class="chapter-reader-title" id="chapter-reader-title"></p>
          <button class="chapter-nav-button" id="chapter-furigana-toggle" type="button" aria-pressed="true">ふりがな ON</button>
          <button class="chapter-nav-button" id="chapter-next" type="button" aria-label="Próximo capítulo">章 →</button>
        </div>
        <div class="chapter-reading-viewport" id="chapter-reading-viewport">
          <div class="chapter-reading-text" id="chapter-reading-text" lang="ja" role="button" tabindex="0" aria-label="Alternar furigana" aria-pressed="true"></div>
        </div>
        <p class="chapter-swipe-hint" id="chapter-swipe-hint">Deslize para trocar de capítulo.</p>
      </section>
    </article>

    <footer id="page-footer">原作：A Princess of Mars</footer>
  </main>
  <script type="module">
    // BOOK_DATA_START
    const bookDataUrl = "../books/princess-of-mars-ja.json";
    const bookDataResponse = await fetch(bookDataUrl);
    if (!bookDataResponse.ok) {
      throw new Error(`Falha ao carregar o livro: ${bookDataResponse.status}`);
    }
    const bookData = await bookDataResponse.json();
    const chapters = bookData.chapters;
    // BOOK_DATA_END

    const fontDecrease = document.querySelector("#font-decrease");
    const fontIncrease = document.querySelector("#font-increase");
    const fontLevel = document.querySelector("#font-level");
    const panel = document.querySelector("#study-panel");
    const label = document.querySelector("#study-label");
    const paragraphBoundary = document.querySelector("#paragraph-boundary");
    const paragraphEnd = document.querySelector("#paragraph-end");
    const selectedSentence = document.querySelector("#selected-sentence");
    const sentenceTranslation = document.querySelector("#sentence-translation");
    const interlinear = document.querySelector("#interlinear");
    const chapterSelect = document.querySelector("#chapter-select");
    const previousParagraphButton = document.querySelector("#study-previous-paragraph");
    const previousButton = document.querySelector("#study-previous");
    const nextButton = document.querySelector("#study-next");
    const nextParagraphButton = document.querySelector("#study-next-paragraph");
    const furiganaToggle = document.querySelector("#furigana-toggle");
    const glossCount = document.querySelector("#gloss-count");
    const glossExport = document.querySelector("#gloss-export");
    const glossImport = document.querySelector("#gloss-import");
    const glossImportFile = document.querySelector("#gloss-import-file");
    const studyHint = document.querySelector("#study-hint");
    const modeButtons = [...document.querySelectorAll("[data-reading-mode]")];
    const chapterReader = document.querySelector("#chapter-reader");
    const chapterReaderToolbar = document.querySelector(".chapter-reader-toolbar");
    const chapterReaderTitle = document.querySelector("#chapter-reader-title");
    const chapterReadingViewport = document.querySelector("#chapter-reading-viewport");
    const chapterReadingText = document.querySelector("#chapter-reading-text");
    const chapterPreviousButton = document.querySelector("#chapter-previous");
    const chapterNextButton = document.querySelector("#chapter-next");
    const chapterFuriganaToggle = document.querySelector("#chapter-furigana-toggle");
    const chapterSwipeHint = document.querySelector("#chapter-swipe-hint");
    if (bookData) {
      document.title = bookData.page.title;
      document.querySelector('meta[name="description"]').content = bookData.page.description;
      document.querySelector("#page-eyebrow").textContent = bookData.page.eyebrow;
      document.querySelector("#page-title").textContent = bookData.page.title;
      document.querySelector("#page-author").textContent = bookData.page.author;
      document.querySelector("#study-hint").textContent = bookData.page.study_hint;
      document.querySelector("#page-footer").textContent = bookData.page.footer;
    }
    const chapterSentenceStarts = [];
    const paragraphSentenceStarts = [];
    const paragraphSentenceCounts = [];
    const sentenceParagraphIndexes = [];
    const paragraphs = [];
    let sentenceTotal = 0;
    chapters.forEach((chapter) => {
      chapterSentenceStarts.push(sentenceTotal);
      chapter.paragraphs.forEach((paragraph) => {
        const paragraphIndex = paragraphs.length;
        paragraphSentenceStarts.push(sentenceTotal);
        paragraphSentenceCounts.push(paragraph.length);
        paragraphs.push(paragraph);
        paragraph.forEach(() => sentenceParagraphIndexes.push(paragraphIndex));
        sentenceTotal += paragraph.length;
      });
    });
    const sentences = paragraphs.flat();
    chapterSelect.replaceChildren(...chapters.map((chapter, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = chapter.title;
      return option;
    }));
    const storageScope = bookData?.source_file || location.pathname;
    const activeCardStorageKey = `simple-ja-books:active-card:v1:${storageScope}`;
    let activeIndex = loadActiveIndex();
    const furiganaStorageKey = `simple-ja-books:furigana-visible:v1:${storageScope}`;
    let furiganaVisible = loadFuriganaVisibility();
    const readingModeStorageKey = "simple-ja-books:reading-mode:v1";
    let readingMode = loadReadingMode();
    const readingPositionsStorageKey = `simple-ja-books:reading-positions:v1:${storageScope}`;
    let readingPositions = loadReadingPositions();
    let chapterReaderIndex = readingPositions[readingMode === "sentence" ? "continuous" : readingMode].chapterIndex;
    let restoringReadingPosition = false;
    let positionSaveFrame = null;
    const fontPercentages = [85, 100, 115, 130, 150];
    const defaultFontLevelIndex = 1;
    const minFontLevel = -defaultFontLevelIndex;
    const maxFontLevel = fontPercentages.length - defaultFontLevelIndex - 1;
    let currentFontLevel = Number.parseInt(localStorage.getItem("reading-font-level") || "0", 10);
    const markedGlossesStorageKey = "simple-ja-books:marked-glosses:v1";
    let markedGlosses = loadMarkedGlosses();

    function loadReadingMode() {
      try {
        const stored = localStorage.getItem(readingModeStorageKey);
        return ["sentence", "continuous", "vertical"].includes(stored) ? stored : "sentence";
      } catch (_error) {
        return "sentence";
      }
    }

    function loadActiveIndex() {
      try {
        const stored = Number.parseInt(localStorage.getItem(activeCardStorageKey) || "0", 10);
        return Number.isInteger(stored)
          ? Math.min(Math.max(stored, 0), sentences.length - 1)
          : 0;
      } catch (_error) {
        return 0;
      }
    }

    function normalizeReadingPositions(stored) {
      const fallbackChapter = activeChapterForIndex(activeIndex);
      const defaults = {
        sentence: { chapterIndex: fallbackChapter, pageScrollY: 0, scrollLeft: null },
        continuous: { chapterIndex: fallbackChapter, pageScrollY: 0, scrollLeft: null },
        vertical: { chapterIndex: fallbackChapter, pageScrollY: 0, scrollLeft: null }
      };
      Object.keys(defaults).forEach((mode) => {
        const position = stored?.[mode];
        if (!position || typeof position !== "object") return;
        if (Number.isInteger(position.chapterIndex)) {
          defaults[mode].chapterIndex = Math.min(Math.max(position.chapterIndex, 0), chapters.length - 1);
        }
        if (Number.isFinite(position.pageScrollY)) {
          defaults[mode].pageScrollY = Math.max(position.pageScrollY, 0);
        }
        if (Number.isFinite(position.scrollLeft)) {
          defaults[mode].scrollLeft = position.scrollLeft;
        }
      });
      return defaults;
    }

    function loadFuriganaVisibility() {
      try {
        return localStorage.getItem(furiganaStorageKey) !== "false";
      } catch (_error) {
        return true;
      }
    }

    function loadReadingPositions() {
      try {
        return normalizeReadingPositions(JSON.parse(localStorage.getItem(readingPositionsStorageKey) || "{}"));
      } catch (_error) {
        return normalizeReadingPositions({});
      }
    }

    function saveReadingPositions() {
      try {
        localStorage.setItem(readingPositionsStorageKey, JSON.stringify(readingPositions));
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
    }

    function captureReadingPosition(mode = readingMode) {
      if (restoringReadingPosition) return;
      const position = readingPositions[mode];
      position.pageScrollY = Math.max(window.scrollY, 0);
      if (mode === "sentence") {
        position.chapterIndex = activeChapterForIndex(activeIndex);
      } else {
        position.chapterIndex = chapterReaderIndex;
        position.scrollLeft = chapterReadingViewport.scrollLeft;
      }
      saveReadingPositions();
    }

    function scheduleReadingPositionSave() {
      if (restoringReadingPosition || positionSaveFrame !== null) return;
      positionSaveFrame = requestAnimationFrame(() => {
        positionSaveFrame = null;
        captureReadingPosition();
      });
    }

    function restoreSentencePosition() {
      restoringReadingPosition = true;
      requestAnimationFrame(() => {
        window.scrollTo(0, readingPositions.sentence.pageScrollY);
        restoringReadingPosition = false;
      });
    }

    function saveActiveIndex() {
      try {
        localStorage.setItem(activeCardStorageKey, String(activeIndex));
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
    }

    function glossKey(term, portuguese) {
      return JSON.stringify([term, portuguese]);
    }

    function loadMarkedGlosses() {
      try {
        const stored = JSON.parse(localStorage.getItem(markedGlossesStorageKey) || "[]");
        if (!Array.isArray(stored)) return new Map();
        return new Map(stored
          .filter((entry) => entry && typeof entry.term === "string" && typeof entry.portuguese === "string")
          .map((entry) => [glossKey(entry.term, entry.portuguese), {
            term: entry.term,
            portuguese: entry.portuguese
          }]));
      } catch (_error) {
        return new Map();
      }
    }

    function saveMarkedGlosses() {
      try {
        localStorage.setItem(markedGlossesStorageKey, JSON.stringify([...markedGlosses.values()]));
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
      updateGlossCount();
    }

    function updateGlossCount() {
      const count = markedGlosses.size;
      glossCount.textContent = `${count} ${count === 1 ? "gloss marcado" : "glosses marcados"}`;
    }

    if (!Number.isInteger(currentFontLevel) || currentFontLevel < minFontLevel || currentFontLevel > maxFontLevel) {
      currentFontLevel = 0;
    }

    function updateFontLevel() {
      panel.dataset.fontLevel = String(currentFontLevel);
      chapterReader.dataset.fontLevel = String(currentFontLevel);
      fontLevel.value = `${fontPercentages[currentFontLevel + defaultFontLevelIndex]}%`;
      fontDecrease.disabled = currentFontLevel === minFontLevel;
      fontIncrease.disabled = currentFontLevel === maxFontLevel;
      localStorage.setItem("reading-font-level", String(currentFontLevel));
    }

    fontDecrease.addEventListener("click", () => {
      currentFontLevel = Math.max(minFontLevel, currentFontLevel - 1);
      updateFontLevel();
    });

    fontIncrease.addEventListener("click", () => {
      currentFontLevel = Math.min(maxFontLevel, currentFontLevel + 1);
      updateFontLevel();
    });

    updateFontLevel();

    function toHiragana(value) {
      return value.replace(/[ァ-ヶ]/g, (character) =>
        String.fromCharCode(character.charCodeAt(0) - 0x60)
      );
    }

    function appendAlignedRuby(target, surface, reading) {
      const kanjiPattern = /^[\p{Script=Han}々〆ヵヶ0-9０-９]+$/u;
      const runs = surface.match(/[\p{Script=Han}々〆ヵヶ0-9０-９]+|[^\p{Script=Han}々〆ヵヶ0-9０-９]+/gu) || [surface];
      const normalizedReading = toHiragana(reading);
      let readingCursor = 0;

      runs.forEach((run, index) => {
        if (!kanjiPattern.test(run)) {
          target.append(document.createTextNode(run));
          const normalizedRun = toHiragana(run);
          if (normalizedReading.startsWith(normalizedRun, readingCursor)) {
            readingCursor += normalizedRun.length;
          }
          return;
        }

        const nextRun = runs[index + 1];
        const nextAnchor = nextRun && !kanjiPattern.test(nextRun)
          ? toHiragana(nextRun)
          : "";
        let readingEnd = nextAnchor
          ? normalizedReading.indexOf(nextAnchor, readingCursor)
          : normalizedReading.length;

        if (readingEnd < readingCursor) {
          readingEnd = normalizedReading.length;
        }

        const ruby = document.createElement("ruby");
        ruby.append(document.createTextNode(run));
        const rt = document.createElement("rt");
        rt.textContent = reading.slice(readingCursor, readingEnd);
        ruby.append(rt);
        target.append(ruby);
        readingCursor = readingEnd;
      });
    }

    function appendSentenceWithRuby(target, sentence) {
      let cursor = 0;
      sentence.chunks.forEach(([surface, reading]) => {
        const start = sentence.text.indexOf(surface, cursor);
        if (start > cursor) {
          target.append(document.createTextNode(sentence.text.slice(cursor, start)));
        }
        appendAlignedRuby(target, surface, reading);
        cursor = start + surface.length;
      });
      if (cursor < sentence.text.length) {
        target.append(document.createTextNode(sentence.text.slice(cursor)));
      }
    }

    function activeChapterForIndex(index) {
      let activeChapter = 0;
      chapterSentenceStarts.forEach((start, chapterIndex) => {
        if (start <= index) activeChapter = chapterIndex;
      });
      return activeChapter;
    }

    function updateFuriganaState() {
      try {
        localStorage.setItem(furiganaStorageKey, String(furiganaVisible));
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
      selectedSentence.classList.toggle("furigana-hidden", !furiganaVisible);
      chapterReadingText.classList.toggle("furigana-hidden", !furiganaVisible);
      selectedSentence.setAttribute("aria-pressed", String(furiganaVisible));
      chapterReadingText.setAttribute("aria-pressed", String(furiganaVisible));
      furiganaToggle.setAttribute("aria-pressed", String(furiganaVisible));
      chapterFuriganaToggle.setAttribute("aria-pressed", String(furiganaVisible));
      const toggleLabel = "ふりがな " + (furiganaVisible ? "ON" : "OFF");
      furiganaToggle.textContent = toggleLabel;
      chapterFuriganaToggle.textContent = toggleLabel;
    }

    function renderFullChapter(chapterIndex, restorePosition = true) {
      const storedPosition = readingPositions[readingMode];
      const sameChapter = storedPosition.chapterIndex === chapterIndex;
      if (!restorePosition || !sameChapter) {
        storedPosition.pageScrollY = 0;
        storedPosition.scrollLeft = null;
      }
      chapterReaderIndex = chapterIndex;
      storedPosition.chapterIndex = chapterIndex;
      saveReadingPositions();
      chapterSelect.value = String(chapterIndex);
      chapterReaderTitle.textContent = chapters[chapterIndex].title;
      chapterPreviousButton.disabled = chapterIndex === 0;
      chapterNextButton.disabled = chapterIndex === chapters.length - 1;
      chapterReader.classList.toggle("vertical", readingMode === "vertical");
      chapterSwipeHint.textContent = readingMode === "vertical"
        ? "Deslize na barra acima para trocar de capítulo; arraste o texto para percorrer as colunas."
        : "Deslize para trocar de capítulo.";
      chapterReadingText.replaceChildren();
      chapters[chapterIndex].paragraphs.forEach((paragraph) => {
        const paragraphElement = document.createElement("p");
        paragraph.forEach((sentence) => appendSentenceWithRuby(paragraphElement, sentence));
        chapterReadingText.append(paragraphElement);
      });
      updateFuriganaState();
      const targetPageScrollY = storedPosition.pageScrollY;
      const targetScrollLeft = storedPosition.scrollLeft;
      restoringReadingPosition = true;
      requestAnimationFrame(() => {
        chapterReadingViewport.scrollTop = 0;
        chapterReadingViewport.scrollLeft = readingMode === "vertical"
          ? (Number.isFinite(targetScrollLeft) ? targetScrollLeft : chapterReadingViewport.scrollWidth)
          : 0;
        window.scrollTo(0, targetPageScrollY);
        restoringReadingPosition = false;
        captureReadingPosition();
      });
    }

    function setReadingMode(mode, persist = true) {
      const previousMode = readingMode;
      if (persist) captureReadingPosition(previousMode);
      readingMode = mode;
      if (persist) {
        try {
          localStorage.setItem(readingModeStorageKey, mode);
        } catch (_error) {
          // The reader remains usable when storage is unavailable.
        }
      }
      modeButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.readingMode === mode));
      });
      const sentenceMode = mode === "sentence";
      panel.hidden = !sentenceMode;
      studyHint.hidden = !sentenceMode;
      chapterReader.hidden = sentenceMode;
      if (sentenceMode) {
        renderCard(activeIndex);
        restoreSentencePosition();
      } else {
        renderFullChapter(readingPositions[mode].chapterIndex);
      }
    }

    function navigateChapter(offset) {
      const currentChapter = chapterReaderIndex;
      const targetChapter = Math.min(Math.max(currentChapter + offset, 0), chapters.length - 1);
      if (targetChapter !== currentChapter) {
        captureReadingPosition();
        renderFullChapter(targetChapter, false);
      }
    }

    function renderCard(index) {
      activeIndex = index;
      saveActiveIndex();
      const sentence = sentences[activeIndex];
      const activeParagraph = sentenceParagraphIndexes[activeIndex];
      const sentenceInParagraph = activeIndex - paragraphSentenceStarts[activeParagraph];
      const sentencesInParagraph = paragraphSentenceCounts[activeParagraph];
      previousParagraphButton.disabled = activeParagraph === 0;
      previousButton.disabled = activeIndex === 0;
      nextButton.disabled = activeIndex === sentences.length - 1;
      nextParagraphButton.disabled = activeParagraph === paragraphs.length - 1;
      let activeChapter = 0;
      chapterSentenceStarts.forEach((start, index) => {
        if (start <= activeIndex) activeChapter = index;
      });
      chapterSelect.value = String(activeChapter);
      label.textContent = `Parágrafo ${activeParagraph + 1} de ${paragraphs.length} · frase ${sentenceInParagraph + 1} de ${sentencesInParagraph}`;
      paragraphBoundary.hidden = activeParagraph === 0 || sentenceInParagraph !== 0;
      paragraphEnd.hidden = sentenceInParagraph !== sentencesInParagraph - 1;
      selectedSentence.replaceChildren();

      let cursor = 0;
      sentence.chunks.forEach(([surface, reading]) => {
        const start = sentence.text.indexOf(surface, cursor);
        if (start > cursor) {
          selectedSentence.append(document.createTextNode(sentence.text.slice(cursor, start)));
        }

        appendAlignedRuby(selectedSentence, surface, reading);
        cursor = start + surface.length;
      });

      if (cursor < sentence.text.length) {
        selectedSentence.append(document.createTextNode(sentence.text.slice(cursor)));
      }

      sentenceTranslation.textContent = sentence.pt;
      interlinear.replaceChildren();

      sentence.chunks.forEach(([surface, reading, gloss]) => {
        const chunk = document.createElement("button");
        chunk.className = "chunk";
        chunk.type = "button";
        const key = glossKey(surface, gloss);
        chunk.setAttribute("aria-pressed", String(markedGlosses.has(key)));
        chunk.setAttribute("aria-label", `${surface}: ${gloss}. Marcar ou desmarcar gloss.`);

        const japanese = document.createElement("span");
        japanese.className = "chunk-japanese";
        appendAlignedRuby(japanese, surface, reading);

        const meaning = document.createElement("span");
        meaning.className = "gloss";
        meaning.lang = "pt-BR";
        meaning.textContent = gloss;

        chunk.append(japanese, meaning);
        chunk.addEventListener("click", () => {
          if (markedGlosses.has(key)) {
            markedGlosses.delete(key);
            chunk.setAttribute("aria-pressed", "false");
          } else {
            markedGlosses.set(key, { term: surface, portuguese: gloss });
            chunk.setAttribute("aria-pressed", "true");
          }
          saveMarkedGlosses();
        });
        interlinear.append(chunk);
      });
    }

    glossExport.addEventListener("click", () => {
      captureReadingPosition();
      const payload = {
        schema_version: 2,
        source_file: bookData?.source_file || null,
        exported_at: new Date().toISOString(),
        reader_state: {
          reading_mode: readingMode,
          active_sentence_index: activeIndex,
          font_level: currentFontLevel,
          furigana_visible: furiganaVisible,
          positions: readingPositions
        },
        glosses: [...markedGlosses.values()]
      };
      const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "dados-de-leitura.json";
      link.click();
      URL.revokeObjectURL(url);
    });

    glossImport.addEventListener("click", () => glossImportFile.click());

    glossImportFile.addEventListener("change", async () => {
      const [file] = glossImportFile.files;
      if (!file) return;
      try {
        const payload = JSON.parse(await file.text());
        if (![1, 2].includes(payload?.schema_version) || !Array.isArray(payload.glosses)) {
          throw new Error("Formato incompatível");
        }
        const imported = payload.glosses.map((entry) => {
          if (!entry || typeof entry.term !== "string" || !entry.term || typeof entry.portuguese !== "string" || !entry.portuguese) {
            throw new Error("Gloss inválido");
          }
          return entry;
        });
        let importedReaderState = null;
        if (payload.schema_version === 2) {
          const state = payload.reader_state;
          if (payload.source_file !== bookData?.source_file
            || !state || typeof state !== "object"
            || !["sentence", "continuous", "vertical"].includes(state.reading_mode)
            || !Number.isInteger(state.active_sentence_index)
            || !Number.isInteger(state.font_level)
            || state.font_level < minFontLevel || state.font_level > maxFontLevel
            || typeof state.furigana_visible !== "boolean"
            || !state.positions || typeof state.positions !== "object") {
            throw new Error("Estado de leitura inválido");
          }
          importedReaderState = {
            activeIndex: Math.min(Math.max(state.active_sentence_index, 0), sentences.length - 1),
            readingMode: state.reading_mode,
            fontLevel: state.font_level,
            furiganaVisible: state.furigana_visible,
            positions: normalizeReadingPositions(state.positions)
          };
        }

        markedGlosses = new Map(imported.map((entry) => [
          glossKey(entry.term, entry.portuguese),
          { term: entry.term, portuguese: entry.portuguese }
        ]));
        saveMarkedGlosses();

        if (importedReaderState) {
          activeIndex = importedReaderState.activeIndex;
          readingMode = importedReaderState.readingMode;
          currentFontLevel = importedReaderState.fontLevel;
          furiganaVisible = importedReaderState.furiganaVisible;
          readingPositions = importedReaderState.positions;
          chapterReaderIndex = readingPositions[readingMode === "sentence" ? "continuous" : readingMode].chapterIndex;
          saveActiveIndex();
          saveReadingPositions();
          localStorage.setItem(readingModeStorageKey, readingMode);
          updateFontLevel();
          updateFuriganaState();
          setReadingMode(readingMode, false);
        } else if (readingMode === "sentence") {
          renderCard(activeIndex);
        } else {
          renderFullChapter(chapterReaderIndex);
        }
      } catch (_error) {
        window.alert("O arquivo não é um JSON de dados de leitura válido para este livro.");
      } finally {
        glossImportFile.value = "";
      }
    });

    function showPreviousSentence() {
      if (activeIndex > 0) {
        renderCard(activeIndex - 1);
      }
    }

    function showNextSentence() {
      if (activeIndex < sentences.length - 1) {
        renderCard(activeIndex + 1);
      }
    }

    previousButton.addEventListener("click", showPreviousSentence);

    previousParagraphButton.addEventListener("click", () => {
      const activeParagraph = sentenceParagraphIndexes[activeIndex];
      if (activeParagraph > 0) {
        renderCard(paragraphSentenceStarts[activeParagraph - 1]);
      }
    });

    nextButton.addEventListener("click", showNextSentence);

    nextParagraphButton.addEventListener("click", () => {
      const activeParagraph = sentenceParagraphIndexes[activeIndex];
      if (activeParagraph < paragraphs.length - 1) {
        renderCard(paragraphSentenceStarts[activeParagraph + 1]);
      }
    });

    const swipeThreshold = 50;
    let swipePointerId = null;
    let swipeStartX = 0;
    let swipeStartY = 0;
    let suppressClickAfterSwipe = false;

    panel.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" || !event.isPrimary) return;
      swipePointerId = event.pointerId;
      swipeStartX = event.clientX;
      swipeStartY = event.clientY;
    });

    panel.addEventListener("pointerup", (event) => {
      if (event.pointerId !== swipePointerId) return;
      const horizontalDistance = event.clientX - swipeStartX;
      const verticalDistance = event.clientY - swipeStartY;
      swipePointerId = null;

      if (
        Math.abs(horizontalDistance) < swipeThreshold
        || Math.abs(horizontalDistance) <= Math.abs(verticalDistance) * 1.25
      ) return;

      event.preventDefault();
      suppressClickAfterSwipe = true;
      setTimeout(() => { suppressClickAfterSwipe = false; }, 0);
      if (horizontalDistance < 0) {
        showNextSentence();
      } else {
        showPreviousSentence();
      }
    });

    panel.addEventListener("pointercancel", (event) => {
      if (event.pointerId === swipePointerId) swipePointerId = null;
    });

    panel.addEventListener("click", (event) => {
      if (!suppressClickAfterSwipe) return;
      suppressClickAfterSwipe = false;
      event.preventDefault();
      event.stopPropagation();
    }, true);

    chapterSelect.addEventListener("change", () => {
      const chapterIndex = Number(chapterSelect.value);
      if (readingMode === "sentence") {
        renderCard(chapterSentenceStarts[chapterIndex]);
      } else {
        captureReadingPosition();
        renderFullChapter(chapterIndex, false);
      }
    });

    function toggleFurigana() {
      furiganaVisible = !furiganaVisible;
      updateFuriganaState();
    }

    furiganaToggle.addEventListener("click", toggleFurigana);
    selectedSentence.addEventListener("click", toggleFurigana);
    selectedSentence.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggleFurigana();
    });

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => setReadingMode(button.dataset.readingMode));
    });

    chapterPreviousButton.addEventListener("click", () => navigateChapter(-1));
    chapterNextButton.addEventListener("click", () => navigateChapter(1));
    chapterFuriganaToggle.addEventListener("click", toggleFurigana);
    chapterReadingText.addEventListener("click", toggleFurigana);
    chapterReadingText.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggleFurigana();
    });

    let chapterSwipePointerId = null;
    let chapterSwipeStartX = 0;
    let chapterSwipeStartY = 0;
    let suppressChapterClick = false;

    chapterReader.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" || !event.isPrimary) return;
      if (readingMode === "vertical" && !event.target.closest(".chapter-reader-toolbar")) return;
      chapterSwipePointerId = event.pointerId;
      chapterSwipeStartX = event.clientX;
      chapterSwipeStartY = event.clientY;
    });

    chapterReader.addEventListener("pointerup", (event) => {
      if (event.pointerId !== chapterSwipePointerId) return;
      const horizontalDistance = event.clientX - chapterSwipeStartX;
      const verticalDistance = event.clientY - chapterSwipeStartY;
      chapterSwipePointerId = null;
      if (Math.abs(horizontalDistance) < swipeThreshold
        || Math.abs(horizontalDistance) <= Math.abs(verticalDistance) * 1.25) return;
      event.preventDefault();
      suppressChapterClick = true;
      setTimeout(() => { suppressChapterClick = false; }, 0);
      navigateChapter(horizontalDistance < 0 ? 1 : -1);
    });

    chapterReader.addEventListener("pointercancel", (event) => {
      if (event.pointerId === chapterSwipePointerId) chapterSwipePointerId = null;
    });

    chapterReader.addEventListener("click", (event) => {
      if (!suppressChapterClick) return;
      suppressChapterClick = false;
      event.preventDefault();
      event.stopPropagation();
    }, true);

    window.addEventListener("scroll", scheduleReadingPositionSave, { passive: true });
    chapterReadingViewport.addEventListener("scroll", scheduleReadingPositionSave, { passive: true });
    window.addEventListener("pagehide", () => captureReadingPosition());

    updateGlossCount();
    updateFuriganaState();
    setReadingMode(readingMode, false);
  </script>
</body>
</html>
