<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="火星を舞台にした冒険小説を、読みやすい現代日本語で楽しめます。">
  <meta name="theme-color" content="#314f46">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <title>火星のプリンセス</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f3efe4;
      --ink: #22231f;
      --muted: #696a62;
      --rule: #b3ad9f;
      --accent: #314f46;
      --accent-soft: rgb(49 79 70 / 11%);
      --panel: #e9e4d7;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgb(49 79 70 / 8%), transparent 28rem),
        var(--paper);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      line-height: 2;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100% - 2.5rem, 45rem);
      margin: 0 auto;
      padding: clamp(2.5rem, 8vw, 5rem) 0 5rem;
    }

    header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.4rem;
      border-bottom: 1px solid var(--rule);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--accent);
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .eyebrow:empty,
    .study-hint:empty {
      display: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4.25rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.25;
    }

    .author {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .reader-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.45rem;
      margin-top: 1.75rem;
      font-family: system-ui, sans-serif;
    }

    .reader-controls-label {
      margin-right: 0.25rem;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    .font-button {
      min-width: 2.4rem;
      height: 2.2rem;
      padding: 0 0.55rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .font-button:hover,
    .font-button:focus-visible {
      color: var(--paper);
      background: var(--accent);
      border-color: var(--accent);
      outline: none;
    }

    .font-button:disabled {
      color: var(--muted);
      background: transparent;
      border-color: var(--rule);
      cursor: not-allowed;
      opacity: 0.4;
    }

    .font-level {
      min-width: 3.4rem;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
    }

    h2 {
      margin: 0 0 1.4rem;
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .chapter-select {
      width: 100%;
      padding: 0.25rem 2.2rem 0.25rem 0;
      color: var(--accent);
      background: transparent;
      border: 0;
      border-bottom: 1px solid transparent;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }

    .chapter-select:hover,
    .chapter-select:focus-visible {
      border-bottom-color: var(--accent);
      outline: none;
    }

    p {
      margin: 0 0 1.75rem;
      font-size: clamp(1rem, 2.5vw, 1.1rem);
      letter-spacing: 0.025em;
      text-align: justify;
    }

    p + p {
      text-indent: 1em;
    }

    .reading-mode-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.35rem;
      margin: -0.55rem 0 1.25rem;
      padding: 0.3rem;
      background: var(--paper);
      border: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
      border-radius: 999px;
      font-family: system-ui, sans-serif;
    }

    .reading-mode-button {
      min-height: 2.4rem;
      padding: 0.3rem 0.55rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .reading-mode-button[aria-pressed="true"] {
      color: var(--paper);
      background: var(--accent);
      border-color: var(--accent);
    }

    .reading-mode-button:hover,
    .reading-mode-button:focus-visible { border-color: var(--accent); outline: none; }

    .chapter-reader {
      margin: 0.5rem 0 2.5rem;
      padding: clamp(1.25rem, 4vw, 2rem);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      box-shadow: 0 1rem 2.5rem rgb(20 25 22 / 8%);
      font-size: 100%;
      touch-action: pan-y;
    }

    .chapter-reader-toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--rule);
      font-family: system-ui, sans-serif;
      touch-action: pan-y;
    }

    .chapter-reader-title {
      min-width: 0;
      flex: 1;
      margin: 0;
      overflow: hidden;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter-nav-button {
      min-width: 2.6rem;
      height: 2.35rem;
      padding: 0 0.65rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chapter-nav-button:disabled { cursor: not-allowed; opacity: 0.35; }
    .chapter-reading-viewport { max-width: 100%; }

    .chapter-reading-text {
      font-size: 1.1em;
      cursor: pointer;
      line-height: 2.25;
    }
    .chapter-reading-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 0.4rem; }
    .chapter-reading-text p {
      margin-bottom: 1.75rem;
      font-size: inherit;
    }
    .chapter-reading-text rt {
      color: var(--accent);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 0.52em;
      font-weight: 500;
    }
    .chapter-reading-text.furigana-hidden rt { visibility: hidden; }
    .chapter-reader.vertical { touch-action: auto; }
    .chapter-reader.vertical .chapter-reading-viewport {
      --vertical-page-gutter: 0px;
      height: min(72vh, 44rem);
      overflow-x: hidden;
      overflow-y: hidden;
      margin-inline: auto;
      overscroll-behavior-x: contain;
      touch-action: pan-y;
    }
    .chapter-reader.vertical .chapter-reading-text {
      width: max-content;
      min-width: 0;
      height: 100%;
      line-height: 2.25;
      text-orientation: mixed;
      writing-mode: vertical-rl;
    }
    .chapter-reader.vertical .chapter-reading-text p {
      margin: 0 0 0 2.25em;
      text-align: justify;
    }
    .vertical-page-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .vertical-page-controls[hidden] { display: none; }
    .vertical-page-status {
      min-width: 7.5rem;
      margin: 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .chapter-swipe-hint {
      margin: 1rem 0 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.68rem;
      text-align: center;
    }
    .chapter-reader[data-font-level="-2"] { font-size: 80%; }
    .chapter-reader[data-font-level="-1"] { font-size: 90%; }
    .chapter-reader[data-font-level="1"] { font-size: 110%; }
    .chapter-reader[data-font-level="2"] { font-size: 120%; }
    .chapter-reader[data-font-level="3"] { font-size: 140%; }
    .chapter-reader[data-font-level="4"] { font-size: 160%; }

    .study-panel {
      font-size: 100%;
    }

    .study-panel[data-font-level="-2"] {
      font-size: 80%;
    }

    .study-panel[data-font-level="-1"] {
      font-size: 90%;
    }

    .study-panel[data-font-level="1"] {
      font-size: 110%;
    }

    .study-panel[data-font-level="2"] {
      font-size: 120%;
    }

    .study-panel[data-font-level="3"] {
      font-size: 140%;
    }

    .study-panel[data-font-level="4"] {
      font-size: 160%;
    }

    .study-hint {
      margin: -1.25rem 0 2rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      text-align: left;
    }

    .study-panel {
      margin: 0.5rem 0 2.5rem;
      padding: clamp(0.85rem, 3vw, 1.35rem);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      box-shadow: 0 1rem 2.5rem rgb(20 25 22 / 8%);
      text-indent: 0;
      touch-action: pan-y;
    }

    .study-controls {
      margin: -0.4rem -0.4rem 0.65rem;
      padding: 0.4rem;
    }

    .study-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin: 0 0 0.5rem;
      padding: 0.55rem;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
      border-radius: 0.5rem;
      box-shadow: 0 0.35rem 1.2rem rgb(20 25 22 / 8%);
      backdrop-filter: blur(0.6rem);
    }

    .study-label {
      margin: 0;
      color: var(--accent);
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .study-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sentence-audio-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 0.55rem;
      padding: 0.45rem 0.55rem;
      color: var(--muted);
      background: color-mix(in srgb, var(--paper) 60%, transparent);
      border: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
      border-radius: 0.5rem;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
    }

    .sentence-audio-controls[hidden] {
      display: none;
    }

    .sentence-audio-button {
      min-width: 5.8rem;
      padding: 0.42rem 0.7rem;
      color: var(--paper);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .sentence-audio-button:hover,
    .sentence-audio-button:focus-visible {
      color: var(--ink);
      background: var(--accent-soft);
      outline: none;
    }

    .sentence-audio-action {
      padding: 0.42rem 0.65rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .sentence-audio-action:hover,
    .sentence-audio-action:focus-visible,
    .sentence-audio-action[aria-pressed="true"] {
      color: var(--ink);
      background: var(--accent-soft);
      border-color: var(--accent);
      outline: none;
    }

    .sentence-audio-speed,
    .sentence-audio-loop {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .sentence-audio-speed {
      margin-left: auto;
    }

    .sentence-audio-speed select,
    .sentence-audio-loop select {
      min-height: 2rem;
      padding: 0.2rem 0.45rem;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 0.35rem;
      font: inherit;
    }

    .sentence-audio-status {
      flex-basis: 100%;
      min-height: 1em;
      color: var(--muted);
    }

    .sentence-audio-status:empty {
      display: none;
    }

    .study-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      height: 2rem;
      padding: 0 0.55rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .furigana-toggle {
      min-width: 6.4rem;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }

    .study-nav:hover,
    .study-nav:focus-visible {
      color: var(--ink);
      border-color: var(--accent);
      outline: none;
    }

    .study-nav:disabled {
      color: var(--muted);
      border-color: var(--rule);
      cursor: not-allowed;
      opacity: 0.35;
    }

    .selected-sentence {
      margin: 0 0 0.65rem;
      cursor: pointer;
      font-size: 1.35em;
      font-weight: 600;
      line-height: 2.5;
      text-align: left;
      text-indent: 0;
    }

    .selected-sentence.paragraph-start { text-indent: 1em; }

    .next-sentence-preview {
      display: inline-block;
      margin-inline-start: 0.4em;
      color: var(--muted);
      font-weight: 400;
      text-indent: 0;
      white-space: nowrap;
    }

    .next-sentence-preview.measure {
      margin: 0;
      visibility: hidden;
    }

    .selected-sentence:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 0.35rem;
    }

    .selected-sentence ruby {
      ruby-align: center;
    }

    .selected-sentence rt {
      color: var(--accent);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 0.52em;
      font-weight: 500;
    }

    .selected-sentence.furigana-hidden rt {
      visibility: hidden;
    }

    .sentence-translation-row {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      margin: 1.5rem 0 0;
    }

    .sentence-translation {
      flex: 1;
      margin: 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.88em;
      line-height: 1.55;
      text-align: left;
    }

    .translation-speak-button {
      flex: none;
      padding: 0.32rem 0.6rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .translation-speak-button:hover,
    .translation-speak-button:focus-visible,
    .translation-speak-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--accent-soft);
      border-color: var(--accent);
      outline: none;
    }

    .translation-speak-button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .interlinear {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem 0.55rem;
    }

    .chunk {
      display: inline-grid;
      min-width: 3rem;
      grid-template-columns: minmax(0, 1fr) auto;
      overflow: hidden;
      background: color-mix(in srgb, var(--paper) 72%, transparent);
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: 0.35rem;
      font-family: inherit;
      text-align: center;
    }

    .chunk:focus-within {
      border-color: var(--accent);
    }

    .chunk[data-vocabulary="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .chunk[data-listening="true"] {
      box-shadow: inset 0 -0.2rem 0 var(--accent);
    }

    .chunk-vocabulary {
      display: inline-flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.55rem 0.65rem 0.5rem;
      color: inherit;
      background: transparent;
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .chunk-reasons {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-inline-start: 1px solid var(--rule);
    }

    .chunk-reason {
      min-width: 2.15rem;
      flex: 1;
      padding: 0.3rem 0.35rem;
      color: var(--muted);
      background: transparent;
      border: 0;
      font: inherit;
      font-size: 0.8em;
      cursor: pointer;
    }

    .chunk-reason + .chunk-reason {
      border-top: 1px solid var(--rule);
    }

    .chunk-reason[aria-pressed="true"] {
      color: var(--ink);
      background: var(--accent-soft);
    }

    .chunk-vocabulary:focus-visible,
    .chunk-reason:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .chunk-japanese {
      font-size: 1.05em;
      font-weight: 600;
      line-height: 1.6;
    }

    .chunk rt {
      color: var(--accent);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 0.6em;
      font-weight: 500;
    }

    .gloss {
      max-width: 12rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.7em;
      line-height: 1.3;
    }

    .gloss-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
    }

    .gloss-count {
      margin-right: auto;
    }

    .gloss-tool-button {
      padding: 0.25rem 0.55rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font: inherit;
      font-size: 0.85em;
      font-weight: 700;
      cursor: pointer;
    }

    .gloss-tool-button:hover,
    .gloss-tool-button:focus-visible {
      color: var(--paper);
      background: var(--accent);
      border-color: var(--accent);
      outline: none;
    }

    .gloss-tool-button:disabled {
      color: var(--muted);
      background: transparent;
      border-color: var(--rule);
      cursor: not-allowed;
      opacity: 0.45;
    }

    .offline-downloads {
      margin-top: 3rem;
      padding: 1rem;
      color: var(--muted);
      background: color-mix(in srgb, var(--panel) 72%, transparent);
      border: 1px solid var(--rule);
      border-radius: 0.5rem;
      font-family: system-ui, sans-serif;
    }

    .offline-downloads h2 {
      margin: 0 0 0.35rem;
      color: var(--ink);
      font-size: 0.95rem;
      letter-spacing: 0;
    }

    .offline-description,
    .offline-status,
    .offline-storage {
      margin: 0.35rem 0;
      font-size: 0.75rem;
      line-height: 1.5;
    }

    .offline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }

    .offline-button {
      min-height: 2.1rem;
      padding: 0.35rem 0.65rem;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .offline-button:hover,
    .offline-button:focus-visible,
    .offline-button[aria-expanded="true"] {
      color: var(--ink);
      background: var(--accent-soft);
      border-color: var(--accent);
      outline: none;
    }

    .offline-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .offline-progress {
      width: 100%;
      height: 0.5rem;
      margin-top: 0.75rem;
      accent-color: var(--accent);
    }

    .offline-progress[hidden],
    .offline-manage-panel[hidden] {
      display: none;
    }

    .offline-manage-panel {
      margin-top: 0.75rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--rule);
    }

    .offline-remove {
      color: #a34a42;
    }

    footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    @media (min-width: 48rem) {
      main {
        width: min(100% - 4rem, 68rem);
        padding-top: 5rem;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 3rem;
        align-items: end;
      }

      .eyebrow {
        grid-column: 1 / -1;
      }

      h1,
      .author {
        grid-column: 1;
      }

      .reader-controls {
        grid-column: 2;
        grid-row: 2 / 4;
        align-self: end;
        margin: 0 0 0.1rem;
      }

      .study-panel {
        min-height: 25rem;
        padding: 2.5rem 3rem 2.75rem;

    @media (prefers-color-scheme: dark) {

<body>
  <main>
    <header>
      <p class="eyebrow" id="page-eyebrow"></p>
      <h1 id="page-title">火星のプリンセス</h1>
      <p class="author" id="page-author">エドガー・ライス・バローズ</p>
    </header>

    <article>
      <h2><select class="chapter-select" id="chapter-select" aria-label="Selecionar capítulo"><option>Capítulo</option></select></h2>

      <nav class="reading-mode-switch" aria-label="Modo de leitura">
        <button class="reading-mode-button" type="button" data-reading-mode="sentence" aria-pressed="true">Frases</button>
        <button class="reading-mode-button" type="button" data-reading-mode="continuous" aria-pressed="false">Corrido</button>
        <button class="reading-mode-button" type="button" data-reading-mode="vertical" aria-pressed="false">Vertical</button>
      </nav>

      <p class="study-hint" id="study-hint"></p>

      <noscript><p>このページを表示するにはJavaScriptを有効にしてください。</p></noscript>

      <section class="study-panel" id="study-panel" aria-live="polite">
        <div class="study-controls">
          <div class="study-topline">
            <p class="study-label" id="study-label">Interlinear</p>
            <div class="study-actions" aria-label="Navegação entre frases e parágrafos">
              <button class="study-nav" id="study-previous-paragraph" type="button" aria-label="Parágrafo anterior" title="Parágrafo anterior">−¶</button>
              <button class="study-nav" id="study-previous" type="button" aria-label="Frase anterior">←</button>
              <button class="study-nav furigana-toggle" id="furigana-toggle" type="button" aria-pressed="true">ふりがな ON</button>
              <button class="study-nav" id="study-next" type="button" aria-label="Próxima frase">→</button>
              <button class="study-nav" id="study-next-paragraph" type="button" aria-label="Próximo parágrafo" title="Próximo parágrafo">＋¶</button>
            </div>
          </div>
          <div class="sentence-audio-controls" id="sentence-audio-controls" aria-label="Áudio da frase" hidden>
            <button class="sentence-audio-button" id="sentence-audio-toggle" type="button" aria-pressed="false">▶ Ouvir</button>
            <button class="sentence-audio-action" id="sentence-audio-restart" type="button" aria-label="Reproduzir a frase desde o início" title="Reproduzir desde o início">↺ Início</button>
            <label class="sentence-audio-loop" for="sentence-audio-loop">
              ↻ Loop
              <select id="sentence-audio-loop" aria-label="Modo de repetição do áudio">
                <option value="off">Desligado</option>
                <option value="sentence">Frase</option>
                <option value="listening">Glosses + frase</option>
                <option value="listening-ja">Glosses JP + frase</option>
                <option value="translation">Tradução + frase</option>
                <option value="paragraph">Parágrafo</option>
                <option value="listening-paragraph">Glosses + parágrafo</option>
                <option value="listening-ja-paragraph">Glosses JP + parágrafo</option>
                <option value="translation-paragraph">Tradução + parágrafo</option>
              </select>
            </label>
            <span id="sentence-audio-voice"></span>
            <label class="sentence-audio-speed" for="sentence-audio-speed">
              Velocidade
              <select id="sentence-audio-speed" aria-label="Velocidade do áudio"></select>
            </label>
            <span class="sentence-audio-status" id="sentence-audio-status" aria-live="polite"></span>
          </div>
          <div class="gloss-tools" aria-label="Glosses marcados">
            <span class="gloss-count" id="gloss-count" aria-label="Nenhum gloss marcado">★ 0 · 🎧 0</span>
            <button class="gloss-tool-button" id="gloss-speak" type="button" aria-label="Ouvir glosses de escuta da frase atual" aria-pressed="false" disabled>▶ Escuta</button>
            <button class="gloss-tool-button" id="gloss-speak-ja" type="button" aria-label="Ouvir somente em japonês os glosses de escuta da frase atual" aria-pressed="false" disabled>▶ JP</button>
            <button class="gloss-tool-button" id="gloss-export" type="button" aria-label="Exportar dados de leitura em JSON" title="Exportar dados de leitura em JSON">↓ JSON</button>
            <button class="gloss-tool-button" id="gloss-import" type="button" aria-label="Importar dados de leitura em JSON" title="Importar dados de leitura em JSON">↑ JSON</button>
            <input id="gloss-import-file" type="file" accept="application/json,.json" hidden>
          </div>
        </div>
        <p class="selected-sentence" id="selected-sentence" lang="ja" role="button" tabindex="0" aria-label="Alternar furigana" aria-pressed="true"></p>
        <div class="interlinear" id="interlinear"></div>
        <div class="sentence-translation-row">
          <p class="sentence-translation" id="sentence-translation" lang="pt-BR"></p>
          <button class="translation-speak-button" id="translation-speak" type="button" aria-label="Ouvir tradução em português" aria-pressed="false">▶ PT</button>
        </div>
      </section>

      <section class="chapter-reader" id="chapter-reader" aria-live="polite" hidden>
        <div class="chapter-reader-toolbar">
          <button class="chapter-nav-button" id="chapter-previous" type="button" aria-label="Capítulo anterior">← 章</button>
          <p class="chapter-reader-title" id="chapter-reader-title"></p>
          <button class="chapter-nav-button" id="chapter-furigana-toggle" type="button" aria-pressed="true">ふりがな ON</button>
          <button class="chapter-nav-button" id="chapter-next" type="button" aria-label="Próximo capítulo">章 →</button>
        </div>
        <div class="chapter-reading-viewport" id="chapter-reading-viewport">
          <div class="chapter-reading-text" id="chapter-reading-text" lang="ja" role="button" tabindex="0" aria-label="Alternar furigana" aria-pressed="true"></div>
        </div>
        <nav class="vertical-page-controls" id="vertical-page-controls" aria-label="Navegação entre páginas" hidden>
          <button class="chapter-nav-button" id="vertical-page-next" type="button" aria-label="Próxima página">Próxima</button>
          <p class="vertical-page-status" id="vertical-page-status" aria-live="polite">Página 1 de 1</p>
          <button class="chapter-nav-button" id="vertical-page-previous" type="button" aria-label="Página anterior">Anterior</button>
        </nav>
        <p class="chapter-swipe-hint" id="chapter-swipe-hint">Deslize para trocar de capítulo.</p>
      </section>
    </article>

    <div class="reader-controls" aria-label="Controles de tamanho do texto">
      <span class="reader-controls-label">文字サイズ</span>
      <button class="font-button" id="font-decrease" type="button" aria-label="Diminuir o texto japonês">A−</button>
      <output class="font-level" id="font-level" aria-live="polite">100%</output>
      <button class="font-button" id="font-increase" type="button" aria-label="Aumentar o texto japonês">A＋</button>
    </div>

    <section class="offline-downloads" aria-labelledby="offline-title">
      <h2 id="offline-title">Leitura offline</h2>
      <p class="offline-description">Salve os textos e os áudios Nise neste navegador. As vozes de síntese dependem do dispositivo.</p>
      <div class="offline-actions">
        <button class="offline-button" id="offline-chapter-download" type="button">↓ Capítulo atual</button>
        <button class="offline-button" id="offline-book-download" type="button">↓ Livro completo</button>
        <button class="offline-button" id="offline-manage" type="button" aria-expanded="false" aria-controls="offline-manage-panel">Gerenciar</button>
      </div>
      <progress class="offline-progress" id="offline-progress" value="0" max="1" hidden></progress>
      <p class="offline-status" id="offline-status" aria-live="polite">Verificando disponibilidade…</p>
      <div class="offline-manage-panel" id="offline-manage-panel" hidden>
        <p class="offline-storage" id="offline-storage"></p>
        <button class="offline-button offline-remove" id="offline-remove" type="button">Remover arquivos offline</button>
      </div>
    </section>

    <footer id="page-footer">原作：A Princess of Mars</footer>
  </main>
  <script type="module">
    // BOOK_DATA_START
    const bookDataUrl = "../books/princess-of-mars-ja.json";
    const bookDataResponse = await fetch(bookDataUrl);
    if (!bookDataResponse.ok) {
      throw new Error(`Falha ao carregar o livro: ${bookDataResponse.status}`);
    }
    const bookData = await bookDataResponse.json();
    const chapters = bookData.chapters;
    // BOOK_DATA_END

    const fontDecrease = document.querySelector("#font-decrease");
    const fontIncrease = document.querySelector("#font-increase");
    const fontLevel = document.querySelector("#font-level");
    const panel = document.querySelector("#study-panel");
    const label = document.querySelector("#study-label");
    const selectedSentence = document.querySelector("#selected-sentence");
    const sentenceTranslation = document.querySelector("#sentence-translation");
    const translationSpeak = document.querySelector("#translation-speak");
    const interlinear = document.querySelector("#interlinear");
    const chapterSelect = document.querySelector("#chapter-select");
    const previousParagraphButton = document.querySelector("#study-previous-paragraph");
    const previousButton = document.querySelector("#study-previous");
    const nextButton = document.querySelector("#study-next");
    const nextParagraphButton = document.querySelector("#study-next-paragraph");
    const furiganaToggle = document.querySelector("#furigana-toggle");
    const glossCount = document.querySelector("#gloss-count");
    const glossSpeak = document.querySelector("#gloss-speak");
    const glossSpeakJapanese = document.querySelector("#gloss-speak-ja");
    const glossExport = document.querySelector("#gloss-export");
    const glossImport = document.querySelector("#gloss-import");
    const glossImportFile = document.querySelector("#gloss-import-file");
    const sentenceAudioControls = document.querySelector("#sentence-audio-controls");
    const sentenceAudioToggle = document.querySelector("#sentence-audio-toggle");
    const sentenceAudioRestart = document.querySelector("#sentence-audio-restart");
    const sentenceAudioLoop = document.querySelector("#sentence-audio-loop");
    const sentenceAudioVoice = document.querySelector("#sentence-audio-voice");
    const sentenceAudioSpeed = document.querySelector("#sentence-audio-speed");
    const sentenceAudioStatus = document.querySelector("#sentence-audio-status");
    const offlineChapterDownload = document.querySelector("#offline-chapter-download");
    const offlineBookDownload = document.querySelector("#offline-book-download");
    const offlineManage = document.querySelector("#offline-manage");
    const offlineManagePanel = document.querySelector("#offline-manage-panel");
    const offlineProgress = document.querySelector("#offline-progress");
    const offlineStatus = document.querySelector("#offline-status");
    const offlineStorage = document.querySelector("#offline-storage");
    const offlineRemove = document.querySelector("#offline-remove");
    const studyHint = document.querySelector("#study-hint");
    const modeButtons = [...document.querySelectorAll("[data-reading-mode]")];
    const chapterReader = document.querySelector("#chapter-reader");
    const chapterReaderToolbar = document.querySelector(".chapter-reader-toolbar");
    const chapterReaderTitle = document.querySelector("#chapter-reader-title");
    const chapterReadingViewport = document.querySelector("#chapter-reading-viewport");
    const chapterReadingText = document.querySelector("#chapter-reading-text");
    const chapterPreviousButton = document.querySelector("#chapter-previous");
    const chapterNextButton = document.querySelector("#chapter-next");
    const chapterFuriganaToggle = document.querySelector("#chapter-furigana-toggle");
    const chapterSwipeHint = document.querySelector("#chapter-swipe-hint");
    const verticalPageControls = document.querySelector("#vertical-page-controls");
    const verticalPagePrevious = document.querySelector("#vertical-page-previous");
    const verticalPageNext = document.querySelector("#vertical-page-next");
    const verticalPageStatus = document.querySelector("#vertical-page-status");
    if (bookData) {
      document.title = bookData.page.title;
      document.querySelector('meta[name="description"]').content = bookData.page.description;
      document.querySelector("#page-eyebrow").textContent = bookData.page.eyebrow;
      document.querySelector("#page-title").textContent = bookData.page.title;
      document.querySelector("#page-author").textContent = bookData.page.author;
      document.querySelector("#study-hint").textContent = bookData.page.study_hint;
      document.querySelector("#page-footer").textContent = bookData.page.footer;
    }
    const chapterSentenceStarts = [];
    const chapterParagraphStarts = [];
    const chapterParagraphCounts = [];
    const paragraphSentenceStarts = [];
    const paragraphSentenceCounts = [];
    const sentenceParagraphIndexes = [];
    const paragraphs = [];
    let sentenceTotal = 0;
    chapters.forEach((chapter) => {
      chapterSentenceStarts.push(sentenceTotal);
      chapterParagraphStarts.push(paragraphs.length);
      chapterParagraphCounts.push(chapter.paragraphs.length);
      chapter.paragraphs.forEach((paragraph) => {
        const paragraphIndex = paragraphs.length;
        paragraphSentenceStarts.push(sentenceTotal);
        paragraphSentenceCounts.push(paragraph.length);
        paragraphs.push(paragraph);
        paragraph.forEach(() => sentenceParagraphIndexes.push(paragraphIndex));
        sentenceTotal += paragraph.length;
      });
    });
    const sentences = paragraphs.flat();
    chapterSelect.replaceChildren(...chapters.map((chapter, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = chapter.title;
      return option;
    }));
    const storageScope = bookData?.source_file || location.pathname;
    const activeCardStorageKey = `simple-ja-books:active-card:v1:${storageScope}`;
    let activeIndex = loadActiveIndex();
    const sentenceChapterPositionsStorageKey = `simple-ja-books:sentence-chapter-positions:v1:${storageScope}`;
    let sentenceChapterPositions = loadSentenceChapterPositions();
    const furiganaStorageKey = `simple-ja-books:furigana-visible:v1:${storageScope}`;
    let furiganaVisible = loadFuriganaVisibility();
    const readingModeStorageKey = "simple-ja-books:reading-mode:v1";
    let readingMode = loadReadingMode();
    const readingPositionsStorageKey = `simple-ja-books:reading-positions:v1:${storageScope}`;
    let readingPositions = loadReadingPositions();
    let chapterReaderIndex = readingPositions[readingMode === "sentence" ? "continuous" : readingMode].chapterIndex;
    let restoringReadingPosition = false;
    let positionSaveFrame = null;
    let nextSentencePreviewFrame = null;
    const fontPercentages = [85, 100, 115, 130, 150];
    const offlineVersion = "066be26f8f2ad697";
    const defaultFontLevelIndex = 1;
    const minFontLevel = -defaultFontLevelIndex;
    const maxFontLevel = fontPercentages.length - defaultFontLevelIndex - 1;
    let currentFontLevel = Number.parseInt(localStorage.getItem("reading-font-level") || "0", 10);
    const markedGlossesStorageKey = "simple-ja-books:marked-glosses:v1";
    const glossReasons = ["vocabulary", "listening"];
    let markedGlosses = loadMarkedGlosses();
    const browserSpeechAvailable = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
    let markedGlossSpeechActive = false;
    let markedGlossSpeechMode = null;
    let markedGlossSpeechQueue = [];
    let markedGlossSpeechRun = 0;
    let markedGlossSpeechOnComplete = null;
    let translationSpeechActive = false;
    let translationSpeechRun = 0;
    let translationSpeechOnComplete = null;
    const audioConfig = bookData?.page?.audio || null;
    const sentenceAudio = audioConfig ? new Audio() : null;
    const sentenceAudioLoopDelayMs = 500;
    const audioSpeedStorageKey = `simple-ja-books:audio-speed:v1:${storageScope}`;
    let currentAudioSpeedPercent = loadAudioSpeed();
    let activeSentenceAudioPath = "";
    let loadedSentenceAudioPath = "";
    let sentenceAudioLoopMode = "off";
    let sentenceAudioLoopTimer = null;
    let sentenceAudioLoopSpeechActive = false;
    if (sentenceAudio) {
      sentenceAudio.preload = "none";
      sentenceAudio.preservesPitch = true;
      sentenceAudioControls.hidden = false;
      sentenceAudioVoice.textContent = `Voz: ${audioConfig.voice}`;
      sentenceAudioSpeed.replaceChildren(...audioConfig.speed_levels_percent.map((percent) => {
        const option = document.createElement("option");
        option.value = String(percent);
        option.textContent = `${(percent / 100).toLocaleString("pt-BR", { maximumFractionDigits: 2 })}×`;
        return option;
      }));
      sentenceAudioSpeed.value = String(currentAudioSpeedPercent);
      sentenceAudio.playbackRate = currentAudioSpeedPercent / 100;
    }

    const offlineSupported = "serviceWorker" in navigator && "caches" in window;
    const offlineWorkerUrl = new URL("../offline-sw.js", document.baseURI).href;
    const offlineCachePrefix = `simple-ja-books-offline:v1:${encodeURIComponent(storageScope)}:`;
    const offlineCacheName = `${offlineCachePrefix}${offlineVersion}`;
    const offlineStateStorageKey = `simple-ja-books:offline-state:v1:${storageScope}`;
    let offlineBusy = false;
    let offlineState = loadOfflineState();

    function normalizeOfflineChapterIndexes(values) {
      if (!Array.isArray(values)) return [];
      return [...new Set(values.filter((index) =>
        Number.isInteger(index) && index >= 0 && index < chapters.length
      ))].sort((a, b) => a - b);
    }

    function emptyOfflineState(pendingChapters = [], pendingBookComplete = false) {
      return {
        version: offlineVersion,
        chapters: [],
        bookComplete: false,
        pendingChapters: normalizeOfflineChapterIndexes(pendingChapters),
        pendingBookComplete
      };
    }

    function loadOfflineState() {
      try {
        const stored = JSON.parse(localStorage.getItem(offlineStateStorageKey) || "null");
        if (!stored || !Array.isArray(stored.chapters)) return emptyOfflineState();
        const storedChapters = normalizeOfflineChapterIndexes(stored.chapters);
        if (stored.version !== offlineVersion) {
          const pendingBookComplete = stored.bookComplete === true
            || stored.pendingBookComplete === true;
          const pendingChapters = pendingBookComplete
            ? chapters.map((_chapter, index) => index)
            : normalizeOfflineChapterIndexes([
                ...storedChapters,
                ...(Array.isArray(stored.pendingChapters) ? stored.pendingChapters : [])
              ]);
          return emptyOfflineState(pendingChapters, pendingBookComplete);
        }
        return {
          version: offlineVersion,
          chapters: storedChapters,
          bookComplete: stored.bookComplete === true,
          pendingChapters: normalizeOfflineChapterIndexes(stored.pendingChapters),
          pendingBookComplete: stored.pendingBookComplete === true
        };
      } catch (_error) {
        return emptyOfflineState();
      }
    }

    function saveOfflineState() {
      try {
        localStorage.setItem(offlineStateStorageKey, JSON.stringify(offlineState));
      } catch (_error) {
        // Cached files remain available when local metadata cannot be persisted.
      }
    }

    function currentOfflineChapterIndex() {
      const selected = Number.parseInt(chapterSelect.value, 10);
      return Number.isInteger(selected) ? selected : activeChapterForIndex(activeIndex);
    }

    function canonicalPageUrl() {
      const url = new URL(".", location.href);
      url.search = "";
      url.hash = "";
      return url.href;
    }

    function offlineUrlsForChapters(chapterIndexes, includeLibrary = false) {
      const urls = new Set([canonicalPageUrl(), offlineWorkerUrl]);
      if (bookDataUrl) urls.add(new URL(bookDataUrl, document.baseURI).href);
      if (includeLibrary) urls.add(new URL("../", document.baseURI).href);
      if (audioConfig) {
        const audioBase = audioConfig.base_url.replace(/\/+$/, "");
        urls.add(new URL(`${audioBase}/manifest.json`, document.baseURI).href);
        chapterIndexes.forEach((chapterIndex) => {
          chapters[chapterIndex].paragraphs.forEach((paragraph, paragraphIndex) => {
            paragraph.forEach((_sentence, sentenceIndex) => {
              urls.add(new URL(
                sentenceAudioPath(chapterIndex, paragraphIndex, sentenceIndex),
                document.baseURI
              ).href);
            });
          });
        });
      }
      return [...urls];
    }

    function formatOfflineBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return "indisponível";
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toLocaleString("pt-BR", { maximumFractionDigits: 1 })} ${units[unit]}`;
    }

    async function updateOfflineStorageEstimate() {
      if (!navigator.storage?.estimate) {
        offlineStorage.textContent = "O navegador não informa o espaço utilizado.";
        return;
      }
      const estimate = await navigator.storage.estimate();
      offlineStorage.textContent = `Armazenamento usado por este site: ${formatOfflineBytes(estimate.usage)}.`;
    }

    function setOfflineBusy(busy) {
      offlineBusy = busy;
      offlineChapterDownload.disabled = busy || !offlineSupported;
      offlineBookDownload.disabled = busy || !offlineSupported;
      offlineManage.disabled = busy || !offlineSupported;
      offlineRemove.disabled = busy || !offlineSupported;
    }

    async function updateOfflineControls() {
      if (!offlineSupported) {
        offlineStatus.textContent = "O modo offline não é compatível com este navegador.";
        setOfflineBusy(false);
        return;
      }
      const cacheNames = await caches.keys();
      const cacheExists = cacheNames.includes(offlineCacheName);
      const previousCacheExists = cacheNames.some((name) =>
        name.startsWith(offlineCachePrefix) && name !== offlineCacheName
      );
      if (!cacheExists && (offlineState.bookComplete || offlineState.chapters.length)) {
        offlineState = emptyOfflineState(
          offlineState.pendingChapters,
          offlineState.pendingBookComplete
        );
        saveOfflineState();
      }
      if (!previousCacheExists && offlineState.pendingChapters.length) {
        offlineState.pendingChapters = [];
        offlineState.pendingBookComplete = false;
        saveOfflineState();
      }
      const chapterIndex = currentOfflineChapterIndex();
      const chapterReady = offlineState.bookComplete || offlineState.chapters.includes(chapterIndex);
      const chapterNeedsUpdate = offlineState.pendingChapters.includes(chapterIndex);
      offlineChapterDownload.textContent = chapterReady
        ? "✓ Capítulo offline"
        : chapterNeedsUpdate ? "↻ Atualizar capítulo" : "↓ Capítulo atual";
      offlineBookDownload.textContent = offlineState.bookComplete
        ? "✓ Livro offline"
        : offlineState.pendingBookComplete ? "↻ Atualizar livro" : "↓ Livro completo";
      if (offlineState.bookComplete) {
        offlineStatus.textContent = "Livro completo disponível offline neste navegador.";
      } else if (offlineState.pendingChapters.length) {
        const count = offlineState.pendingChapters.length;
        offlineStatus.textContent = `${count} ${count === 1 ? "capítulo precisa" : "capítulos precisam"} de atualização offline.`;
      } else if (offlineState.chapters.length) {
        const count = offlineState.chapters.length;
        offlineStatus.textContent = `${count} ${count === 1 ? "capítulo disponível" : "capítulos disponíveis"} offline neste navegador.`;
      } else {
        offlineStatus.textContent = "Nenhum conteúdo deste livro foi salvo para uso offline.";
      }
      setOfflineBusy(offlineBusy);
      if (!offlineManagePanel.hidden) void updateOfflineStorageEstimate();
    }

    async function ensureOfflineWorker() {
      if (!offlineSupported) throw new Error("offline unsupported");
      await navigator.serviceWorker.register(offlineWorkerUrl);
      await navigator.serviceWorker.ready;
    }

    function sameOfflineManifestSettings(current, previous) {
      return ["source_file", "voice", "encoding"].every((key) =>
        JSON.stringify(current?.[key]) === JSON.stringify(previous?.[key])
      );
    }

    function sameOfflineAudioItem(current, previous) {
      return current?.text_sha256 === previous?.text_sha256
        && current?.bytes === previous?.bytes;
    }

    async function reuseUnchangedOfflineAudio(urls, cache) {
      const reused = new Set();
      if (!audioConfig) return reused;
      const cacheNames = (await caches.keys()).filter((name) =>
        name.startsWith(offlineCachePrefix) && name !== offlineCacheName
      );
      if (!cacheNames.length) return reused;

      const audioBase = audioConfig.base_url.replace(/\/+$/, "");
      const audioBaseUrl = new URL(`${audioBase}/`, document.baseURI).href;
      const manifestUrl = new URL(`${audioBase}/manifest.json`, document.baseURI).href;
      const manifestResponse = await fetch(manifestUrl, {
        cache: "reload",
        credentials: "same-origin"
      });
      if (!manifestResponse.ok) throw new Error(`HTTP ${manifestResponse.status}: ${manifestUrl}`);
      const currentManifest = await manifestResponse.clone().json();
      await cache.put(manifestUrl, manifestResponse);

      const candidates = new Map(urls.flatMap((url) => {
        if (!url.startsWith(audioBaseUrl) || url === manifestUrl) return [];
        return [[url, url.slice(audioBaseUrl.length)]];
      }));
      for (const url of [...candidates.keys()]) {
        if (await cache.match(url)) candidates.delete(url);
      }

      for (const cacheName of cacheNames) {
        if (!candidates.size) break;
        const previousCache = await caches.open(cacheName);
        const previousManifestResponse = await previousCache.match(manifestUrl, { ignoreSearch: true });
        if (!previousManifestResponse) continue;
        let previousManifest;
        try {
          previousManifest = await previousManifestResponse.json();
        } catch (_error) {
          continue;
        }
        if (!sameOfflineManifestSettings(currentManifest, previousManifest)) continue;
        for (const [url, relativePath] of [...candidates]) {
          if (!sameOfflineAudioItem(
            currentManifest.items?.[relativePath],
            previousManifest.items?.[relativePath]
          )) continue;
          const response = await previousCache.match(url, { ignoreSearch: true });
          if (!response) continue;
          await cache.put(url, response);
          reused.add(url);
          candidates.delete(url);
        }
      }
      return reused;
    }

    async function cacheOfflineUrls(urls) {
      const cache = await caches.open(offlineCacheName);
      const reusedAudioUrls = await reuseUnchangedOfflineAudio(urls, cache);
      let nextIndex = 0;
      let completed = 0;
      offlineProgress.max = urls.length;
      offlineProgress.value = 0;
      offlineProgress.hidden = false;

      async function cacheWorker() {
        while (nextIndex < urls.length) {
          const index = nextIndex;
          nextIndex += 1;
          const url = urls[index];
          const existing = await cache.match(url);
          let response = null;
          if (!existing) {
            try {
              response = await fetch(url, { cache: "reload", credentials: "same-origin" });
              if (!response.ok) throw new Error(`HTTP ${response.status}: ${url}`);
            } catch (error) {
              const fallback = await cache.match(url);
              if (!fallback) throw error;
            }
          }
          if (response) await cache.put(url, response);
          completed += 1;
          offlineProgress.value = completed;
          const reuseLabel = reusedAudioUrls.size
            ? ` · ${reusedAudioUrls.size} áudios reutilizados`
            : "";
          offlineStatus.textContent = `Salvando ${completed} de ${urls.length} arquivos${reuseLabel}…`;
        }
      }

      const workers = Array.from(
        { length: Math.min(6, urls.length) },
        () => cacheWorker()
      );
      const results = await Promise.allSettled(workers);
      const failure = results.find((result) => result.status === "rejected");
      if (failure) throw failure.reason;
      return reusedAudioUrls.size;
    }

    async function removeObsoleteOfflineCaches() {
      const cacheNames = await caches.keys();
      await Promise.all(cacheNames
        .filter((name) => name.startsWith(offlineCachePrefix) && name !== offlineCacheName)
        .map((name) => caches.delete(name)));
    }

    async function downloadOffline(scope) {
      if (offlineBusy || !offlineSupported) return;
      const chapterIndex = currentOfflineChapterIndex();
      const chapterIndexes = scope === "book"
        ? chapters.map((_chapter, index) => index)
        : [chapterIndex];
      const urls = offlineUrlsForChapters(chapterIndexes, scope === "book");
      setOfflineBusy(true);
      offlineStatus.textContent = "Preparando download offline…";
      let failureMessage = "";
      try {
        if (navigator.storage?.persist) void navigator.storage.persist().catch(() => {});
        await ensureOfflineWorker();
        await cacheOfflineUrls(urls);
        if (scope === "book") {
          offlineState = {
            version: offlineVersion,
            chapters: chapters.map((_chapter, index) => index),
            bookComplete: true,
            pendingChapters: [],
            pendingBookComplete: false
          };
        } else {
          offlineState.chapters = normalizeOfflineChapterIndexes([
            ...offlineState.chapters,
            chapterIndex
          ]);
          offlineState.pendingChapters = offlineState.pendingChapters.filter(
            (index) => index !== chapterIndex
          );
          if (offlineState.chapters.length === chapters.length) {
            offlineState.bookComplete = true;
          }
          if (!offlineState.pendingChapters.length) {
            offlineState.pendingBookComplete = false;
          }
        }
        if (!offlineState.pendingChapters.length) await removeObsoleteOfflineCaches();
        saveOfflineState();
        offlineStatus.textContent = scope === "book"
          ? "Livro completo salvo para uso offline."
          : `Capítulo “${chapters[chapterIndex].title}” salvo para uso offline.`;
      } catch (_error) {
        failureMessage = "O download foi interrompido. Conecte-se à internet e tente novamente.";
      } finally {
        offlineProgress.hidden = true;
        setOfflineBusy(false);
        await updateOfflineControls();
        if (failureMessage) offlineStatus.textContent = failureMessage;
      }
    }

    async function removeOfflineFiles() {
      if (offlineBusy || !offlineSupported) return;
      if (!window.confirm("Remover os arquivos offline deste livro neste navegador?")) return;
      setOfflineBusy(true);
      try {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames
          .filter((name) => name.startsWith(offlineCachePrefix))
          .map((name) => caches.delete(name)));
        localStorage.removeItem(offlineStateStorageKey);
        offlineState = emptyOfflineState();
        offlineStatus.textContent = "Arquivos offline removidos deste navegador.";
      } finally {
        setOfflineBusy(false);
        await updateOfflineControls();
      }
    }

    async function initializeOfflineControls() {
      setOfflineBusy(false);
      if (!offlineSupported) {
        await updateOfflineControls();
        return;
      }
      try {
        await ensureOfflineWorker();
      } catch (_error) {
        offlineStatus.textContent = "Não foi possível ativar o modo offline neste navegador.";
      }
      await updateOfflineControls();
    }

    function stopSentenceAudio() {

      clearSentenceAudioLoopTimer();

      updateSentenceAudioButton(false);
      sentenceAudioStatus.textContent = "";
    }

    function prepareSentenceAudio(chapter, paragraph, sentence) {
      if (!sentenceAudio) return;
      stopSentenceAudio();
      activeSentenceAudioPath = sentenceAudioPath(chapter, paragraph, sentence);
      if (loadedSentenceAudioPath !== activeSentenceAudioPath) {
        sentenceAudio.removeAttribute("src");
        loadedSentenceAudioPath = "";
      }
    }

    async function playSentenceAudio({ restart = false } = {}) {
      if (!sentenceAudio) return;
      clearSentenceAudioLoopTimer();
      stopBrowserSpeech();
      try {
        if (loadedSentenceAudioPath !== activeSentenceAudioPath) {
          sentenceAudio.src = activeSentenceAudioPath;
          loadedSentenceAudioPath = activeSentenceAudioPath;
        }
        if (restart) sentenceAudio.currentTime = 0;
        sentenceAudio.playbackRate = currentAudioSpeedPercent / 100;
        sentenceAudioStatus.textContent = "Carregando…";
        await sentenceAudio.play();
      } catch (_error) {
        updateSentenceAudioButton(false);
        sentenceAudioStatus.textContent = "Não foi possível carregar o áudio desta frase.";
      }
    }

    function loopModeUsesGlosses(mode = sentenceAudioLoopMode) {
      return mode === "listening"
        || mode === "listening-ja"
        || mode === "listening-paragraph"
        || mode === "listening-ja-paragraph";
    }

    function loopModeUsesJapaneseOnlyGlosses(mode = sentenceAudioLoopMode) {
      return mode === "listening-ja" || mode === "listening-ja-paragraph";
    }

    function loopModeUsesTranslation(mode = sentenceAudioLoopMode) {
      return mode === "translation" || mode === "translation-paragraph";
    }

    function loopModeUsesParagraph(mode = sentenceAudioLoopMode) {
      return mode === "paragraph"
        || mode === "listening-paragraph"
        || mode === "listening-ja-paragraph"
        || mode === "translation-paragraph";
    }

    function startSentenceAudioCycle({ restart = false } = {}) {
      if (!sentenceAudio) return;
      clearSentenceAudioLoopTimer();
      if (restart) sentenceAudio.currentTime = 0;
      if (sentenceAudio.currentTime === 0) {
        if (loopModeUsesGlosses()) {
          startGlossesThenSentence();
          return;
        }
        if (loopModeUsesTranslation()) {
          startTranslationThenSentence();
          return;
        }
      }
      playSentenceAudio({ restart });
    }

    function toggleSentenceAudio() {
      if (!sentenceAudio) return;
      if (!sentenceAudio.paused) {
        sentenceAudio.pause();
        return;
      }
      startSentenceAudioCycle();
    }

    function updateSentenceAudioLoop() {
      const listeningOption = sentenceAudioLoop.querySelector('option[value="listening"]');
      const listeningJapaneseOption = sentenceAudioLoop.querySelector('option[value="listening-ja"]');
      const listeningParagraphOption = sentenceAudioLoop.querySelector('option[value="listening-paragraph"]');
      const listeningJapaneseParagraphOption = sentenceAudioLoop.querySelector('option[value="listening-ja-paragraph"]');
      const translationOption = sentenceAudioLoop.querySelector('option[value="translation"]');
      const translationParagraphOption = sentenceAudioLoop.querySelector('option[value="translation-paragraph"]');
      const listeningAvailable = browserSpeechAvailable && currentSentenceListeningGlosses().length > 0;
      const listeningParagraphAvailable = browserSpeechAvailable && currentParagraphHasListeningGlosses();
      listeningOption.disabled = !listeningAvailable;
      listeningJapaneseOption.disabled = !listeningAvailable;
      listeningParagraphOption.disabled = !listeningParagraphAvailable;
      listeningJapaneseParagraphOption.disabled = !listeningParagraphAvailable;
      translationOption.disabled = !browserSpeechAvailable;
      translationParagraphOption.disabled = !browserSpeechAvailable;
      if (["listening", "listening-ja"].includes(sentenceAudioLoopMode) && !listeningAvailable) {
        clearSentenceAudioLoopTimer();
        if (sentenceAudioLoopSpeechActive) stopBrowserSpeech();
        sentenceAudioLoopMode = "sentence";
      } else if (["listening-paragraph", "listening-ja-paragraph"].includes(sentenceAudioLoopMode)
        && !listeningParagraphAvailable) {
        clearSentenceAudioLoopTimer();
        if (sentenceAudioLoopSpeechActive) stopBrowserSpeech();
        sentenceAudioLoopMode = "paragraph";
      } else if (sentenceAudioLoopMode === "translation-paragraph" && !browserSpeechAvailable) {
        clearSentenceAudioLoopTimer();
        if (sentenceAudioLoopSpeechActive) stopBrowserSpeech();
        sentenceAudioLoopMode = "paragraph";
      } else if (sentenceAudioLoopMode === "translation" && !browserSpeechAvailable) {
        clearSentenceAudioLoopTimer();
        if (sentenceAudioLoopSpeechActive) stopBrowserSpeech();
        sentenceAudioLoopMode = "sentence";
      }
      sentenceAudioLoop.value = sentenceAudioLoopMode;
    }

    sentenceAudioToggle.addEventListener("click", toggleSentenceAudio);
    sentenceAudioRestart.addEventListener("click", () => startSentenceAudioCycle({ restart: true }));
    sentenceAudioLoop.addEventListener("change", () => {
      clearSentenceAudioLoopTimer();

      sentenceAudioLoopMode = sentenceAudioLoop.value;
      sentenceAudioStatus.textContent = "";
      updateSentenceAudioLoop();
    });
    sentenceAudioSpeed.addEventListener("change", () => {
      const selected = Number.parseInt(sentenceAudioSpeed.value, 10);
      if (!audioConfig?.speed_levels_percent.includes(selected)) return;
      currentAudioSpeedPercent = selected;
      if (sentenceAudio) sentenceAudio.playbackRate = selected / 100;
      try {
        localStorage.setItem(audioSpeedStorageKey, String(selected));
      } catch (_error) {

      }
    });
    sentenceAudio?.addEventListener("playing", () => {

      sentenceAudioStatus.textContent = "";
    });

    sentenceAudio?.addEventListener("ended", () => {
      sentenceAudio.currentTime = 0;
      updateSentenceAudioButton(false);
      continueSentenceAudioLoop();
    });
    sentenceAudio?.addEventListener("error", () => {
      updateSentenceAudioButton(false);
      sentenceAudioStatus.textContent = "Não foi possível carregar o áudio desta frase.";
    });

    function loadReadingMode() {
      try {
        const stored = localStorage.getItem(readingModeStorageKey);
        return ["sentence", "continuous", "vertical"].includes(stored) ? stored : "sentence";
      } catch (_error) {
        return "sentence";
      }
    }

    function loadActiveIndex() {
      try {
        const stored = Number.parseInt(localStorage.getItem(activeCardStorageKey) || "0", 10);
        return Number.isInteger(stored)
          ? Math.min(Math.max(stored, 0), sentences.length - 1)
          : 0;
      } catch (_error) {
        return 0;
      }
    }

    function validSentenceIndexForChapter(index, chapterIndex) {
      const start = chapterSentenceStarts[chapterIndex];
      const end = chapterIndex + 1 < chapterSentenceStarts.length
        ? chapterSentenceStarts[chapterIndex + 1]
        : sentences.length;
      return Number.isInteger(index) && index >= start && index < end;
    }

    function validSentenceChapterPositions(values) {
      return Array.isArray(values)
        && values.length <= chapters.length
        && values.every((index, chapterIndex) =>
          validSentenceIndexForChapter(index, chapterIndex)
        );
    }

    function normalizeSentenceChapterPositions(stored, fallbackIndex = activeIndex) {
      const positions = [...chapterSentenceStarts];
      if (Array.isArray(stored)) {
        stored.forEach((index, chapterIndex) => {
          if (chapterIndex < chapters.length
            && validSentenceIndexForChapter(index, chapterIndex)) {
            positions[chapterIndex] = index;
          }
        });
      }
      positions[activeChapterForIndex(fallbackIndex)] = fallbackIndex;
      return positions;
    }

    function loadSentenceChapterPositions() {
      try {
        const stored = JSON.parse(localStorage.getItem(sentenceChapterPositionsStorageKey) || "null");
        return normalizeSentenceChapterPositions(stored);
      } catch (_error) {
        return normalizeSentenceChapterPositions(null);
      }
    }

    function normalizeReadingPositions(stored) {
      const fallbackChapter = activeChapterForIndex(activeIndex);
      const defaults = {
        sentence: { chapterIndex: fallbackChapter, pageScrollY: 0, scrollLeft: null, verticalPageIndex: 0 },
        continuous: { chapterIndex: fallbackChapter, pageScrollY: 0, scrollLeft: null, verticalPageIndex: 0 },
        vertical: { chapterIndex: fallbackChapter, pageScrollY: 0, scrollLeft: null, verticalPageIndex: 0 }
      };
      Object.keys(defaults).forEach((mode) => {
        const position = stored?.[mode];
        if (!position || typeof position !== "object") return;
        if (Number.isInteger(position.chapterIndex)) {
          defaults[mode].chapterIndex = Math.min(Math.max(position.chapterIndex, 0), chapters.length - 1);
        }
        if (Number.isFinite(position.pageScrollY)) {
          defaults[mode].pageScrollY = Math.max(position.pageScrollY, 0);
        }
        if (Number.isFinite(position.scrollLeft)) {
          defaults[mode].scrollLeft = position.scrollLeft;
        }
        if (Number.isInteger(position.verticalPageIndex)) {
          defaults[mode].verticalPageIndex = Math.max(position.verticalPageIndex, 0);
        }
      });
      return defaults;
    }

    function loadFuriganaVisibility() {
      try {
        return localStorage.getItem(furiganaStorageKey) !== "false";
      } catch (_error) {
        return true;
      }
    }

    function loadReadingPositions() {
      try {
        return normalizeReadingPositions(JSON.parse(localStorage.getItem(readingPositionsStorageKey) || "{}"));
      } catch (_error) {
        return normalizeReadingPositions({});
      }
    }

    function saveReadingPositions() {
      try {
        localStorage.setItem(readingPositionsStorageKey, JSON.stringify(readingPositions));
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
    }

    function captureReadingPosition(mode = readingMode) {
      if (restoringReadingPosition) return;
      const position = readingPositions[mode];
      position.pageScrollY = Math.max(window.scrollY, 0);
      if (mode === "sentence") {
        position.chapterIndex = activeChapterForIndex(activeIndex);
      } else {

        position.scrollLeft = chapterReadingViewport.scrollLeft;
        if (mode === "vertical") position.verticalPageIndex = verticalPageIndex;
      }
      saveReadingPositions();

    function scheduleReadingPositionSave() {
      if (restoringReadingPosition || positionSaveFrame !== null) return;
      positionSaveFrame = requestAnimationFrame(() => {

        captureReadingPosition();

        restoringReadingPosition = false;
      });

    function saveActiveIndex() {
      sentenceChapterPositions[activeChapterForIndex(activeIndex)] = activeIndex;
      try {
        localStorage.setItem(activeCardStorageKey, String(activeIndex));
        localStorage.setItem(
          sentenceChapterPositionsStorageKey,
          JSON.stringify(sentenceChapterPositions)
        );
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
    }

    function glossKey(term, portuguese) {
      return JSON.stringify([term, portuguese]);
    }

    function normalizeGlossEntry(entry) {
      if (!entry || typeof entry.term !== "string" || !entry.term
        || typeof entry.portuguese !== "string" || !entry.portuguese) return null;
      const storedReasons = entry.reasons === undefined ? ["vocabulary"] : entry.reasons;
      if (!Array.isArray(storedReasons) || storedReasons.length === 0
        || storedReasons.some((reason) => !glossReasons.includes(reason))) return null;
      return {
        term: entry.term,
        portuguese: entry.portuguese,
        reasons: [...new Set(storedReasons)]
      };
    }

    function loadMarkedGlosses() {
      try {
        const stored = JSON.parse(localStorage.getItem(markedGlossesStorageKey) || "[]");
        if (!Array.isArray(stored)) return new Map();
        const normalized = stored.map(normalizeGlossEntry).filter(Boolean);
        return new Map(normalized.map((entry) => [
          glossKey(entry.term, entry.portuguese),
          entry
        ]));
      } catch (_error) {
        return new Map();
      }
    }

    function saveMarkedGlosses() {
      if (markedGlossSpeechActive || translationSpeechActive) stopBrowserSpeech();
      try {
        localStorage.setItem(markedGlossesStorageKey, JSON.stringify([...markedGlosses.values()]));
      } catch (_error) {
        // The reader remains usable when storage is unavailable.
      }
      updateGlossCount();
    }

    function hasGlossReason(term, portuguese, reason) {
      return markedGlosses.get(glossKey(term, portuguese))?.reasons.includes(reason) || false;
    }

    function toggleGlossReason(term, portuguese, reason) {
      const key = glossKey(term, portuguese);
      const entry = markedGlosses.get(key) || { term, portuguese, reasons: [] };
      const reasons = new Set(entry.reasons);
      if (reasons.has(reason)) reasons.delete(reason);
      else reasons.add(reason);
      if (reasons.size === 0) markedGlosses.delete(key);
      else markedGlosses.set(key, { term, portuguese, reasons: [...reasons] });
      saveMarkedGlosses();
    }

    function toggleAllGlossReasons(term, portuguese) {
      const key = glossKey(term, portuguese);
      const allMarked = glossReasons.every((reason) =>
        hasGlossReason(term, portuguese, reason)
      );
      if (allMarked) markedGlosses.delete(key);
      else markedGlosses.set(key, { term, portuguese, reasons: [...glossReasons] });
      saveMarkedGlosses();
    }

    function sentenceListeningGlosses(index) {
      return sentences[index].chunks.flatMap(([term, _reading, portuguese]) =>
        hasGlossReason(term, portuguese, "listening") ? [{ term, portuguese }] : []
      );
    }

    function currentSentenceListeningGlosses() {
      return sentenceListeningGlosses(activeIndex);
    }

    function currentParagraphHasListeningGlosses() {
      const paragraph = sentenceParagraphIndexes[activeIndex];
      const start = paragraphSentenceStarts[paragraph];
      const end = start + paragraphSentenceCounts[paragraph];
      return sentences.slice(start, end).some((_sentence, offset) =>
        sentenceListeningGlosses(start + offset).length > 0
      );
    }

    function updateGlossSpeechButton(mode = null) {

      const fullSpeaking = mode === "full";

      );

      glossSpeak.title = browserSpeechAvailable
        ? "Ouvir os glosses marcados com dificuldade de escuta nesta frase"
