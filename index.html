<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leituras em japonês</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #eee8db; color: #213d35; }
    main { width: min(42rem, calc(100% - 2rem)); margin: 0 auto; padding: 4rem 0; }
    h1 { font-family: Georgia, serif; font-weight: 500; font-size: clamp(2rem, 8vw, 3.5rem); }
    p { color: #58645f; line-height: 1.6; }
    nav { display: grid; gap: 1rem; margin-top: 2.5rem; }
    a { display: block; padding: 1.4rem; border: 1px solid #b9b2a3; border-radius: 1rem;
        background: #f8f3e8; color: inherit; text-decoration: none; font-size: 1.2rem; }
    a:hover, a:focus-visible { border-color: #315d51; box-shadow: 0 4px 18px #315d5122; }
    small { display: block; margin-top: .35rem; color: #68746f; }
  </style>
</head>
<body>
  <main>
    <h1>Leituras em japonês</h1>
    <p>Traduções com furigana, glosses concisos e tradução para o português.</p>
    <nav aria-label="Livros disponíveis">

      <a href="call-of-cthulhu/">クトゥルフの呼び声<small>O Chamado de Cthulhu</small></a>
    </nav>
  </main>

</html>
